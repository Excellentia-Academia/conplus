<title>Josef - Le Grand Quiz Multijoueur</title>
<style>
  :root { --bg1: #1e3c72; --bg2: #2a5298; --accent: #ffb300; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(135deg, var(--bg1), var(--bg2)); min-height: 100vh; color: white; display: grid; place-items: center; padding: 15px; }
  .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); width: 100%; max-width: 850px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
  h1 { text-align: center; margin-bottom: 20px; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
  input { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; margin-bottom: 15px; outline: none; color: #333; }
  button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #fff; color: var(--bg1); transition: 0.2s; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  button:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .hidden { display: none !important; }
  .scoreboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .player-card { background: rgba(0,0,0,0.25); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; font-weight: bold; border: 2px solid transparent; }
  .player-card.me { border-color: rgba(255,255,255,0.5); }
  .question-box { background: rgba(0,0,0,0.3); padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
  #prefix { font-size: 56px; font-weight: 900; letter-spacing: 6px; margin-bottom: 15px; color: var(--accent); text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  #definition { font-size: 20px; line-height: 1.6; font-weight: 500; }
  .timer-container { margin-bottom: 20px; }
  #timer-bar { height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; }
  #timer-fill { height: 100%; background: #00e676; width: 100%; transition: width 0.1s linear; }
  #timer-text { text-align: right; font-size: 16px; font-weight: bold; margin-top: 5px; }
  #msg-game { text-align: center; font-weight: bold; font-size: 18px; min-height: 28px; margin-top: 15px; }
  .code-display { text-align: center; font-size: 40px; letter-spacing: 8px; font-weight: 900; color: var(--accent); margin: 20px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="container">
  <!-- ÉCRAN 1 : ACCUEIL -->
  <div id="screen-home">
    <h1>🎯 Josef - Le Grand Quiz</h1>
    <input type="text" id="pseudo" placeholder="Entre ton prénom (ex: Alice)" maxlength="12" />
    <button onclick="creerPartie()">➕ Créer une nouvelle partie</button>
    <div class="row">
      <input type="text" id="code-join" placeholder="Code à 4 chiffres" maxlength="4" style="margin-bottom:0;" />
      <button onclick="rejoindrePartie()" style="margin-bottom:0;">🔗 Rejoindre</button>
    </div>
    <div id="msg-home" style="color:#ffb300; text-align:center; margin-top:15px; font-weight:bold;"></div>
  </div>

  <!-- ÉCRAN 2 : SALLE D'ATTENTE -->
  <div id="screen-lobby" class="hidden">
    <h1>⏳ Salle d'attente</h1>
    <p style="text-align:center; font-size: 18px;">Partage ce code avec tes amis :</p>
    <div class="code-display" id="lobby-code"></div>
    <div class="scoreboard" id="lobby-players"></div>
    <button id="btn-start" class="hidden" onclick="lancerJeu()">🚀 Lancer la partie (Hôte)</button>
    <div style="text-align:center; color: #ccc; margin-top: 15px; font-style: italic;" id="lobby-status">En attente des autres joueurs...</div>
  </div>

  <!-- ÉCRAN 3 : JEU -->
  <div id="screen-game" class="hidden">
    <div class="scoreboard" id="game-scores"></div>
    
    <div class="question-box">
      <div id="prefix">--</div>
      <div id="definition">Chargement de la question...</div>
    </div>
    
    <div class="timer-container">
      <div id="timer-bar"><div id="timer-fill"></div></div>
      <div id="timer-text">30s</div>
    </div>
    
    <input type="text" id="answer" placeholder="Écris ta réponse ici..." autocomplete="off" />
    <button id="btn-submit" onclick="soumettreReponse()">Valider ma réponse</button>
    <div id="msg-game"></div>
  </div>

  <!-- ÉCRAN 4 : FIN -->
  <div id="screen-end" class="hidden">
    <h1 id="end-title">Partie terminée</h1>
    <div class="scoreboard" id="end-scores" style="margin-top:30px;"></div>
    <button onclick="location.reload()" style="margin-top:20px;">🏠 Retour à l'accueil</button>
  </div>
</div>

// ==========================================
// 3. INITIALISATION DU JEU
// ==========================================
let currentUser = null;
let monPseudo = "";
let codeSalle = "";
let estHote = false;
let unsubscribeSalle = null;
let timerInterval = null;
let dejaRepondu = false;

const POINTS = 10;
const MAX_POINTS = 200;
const TEMPS_PAR_QUESTION = 30; // secondes

// ==========================================
// 4. DÉMARRAGE ET AUTHENTIFICATION
// ==========================================
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('msg-home').innerText = "✅ Connecté à Firebase !";
  } else {
    auth.signInAnonymously().catch(err => {
      document.getElementById('msg-home').innerText = "Erreur Auth : " + err.message;
    });
  }
});

// ==========================================
// 5. CRÉATION ET CONNEXION A LA SALLE
// ==========================================
async function creerPartie() {
  monPseudo = document.getElementById('pseudo').value.trim();
  if (!monPseudo) return alert("Mets un pseudo !");
  if (!currentUser) return alert("Connexion en cours, attends 2 secondes...");

  codeSalle = Math.floor(1000 + Math.random() * 9000).toString();
  estHote = true;

  const nouvelleSalle = {
    hote: monPseudo,
    etat: "lobby",
    questionActuelle: 0,
    questions: [],
    timerStart: 0,
    joueurs: { [monPseudo]: 0 }
  };

  await db.collection('salles').doc(codeSalle).set(nouvelleSalle);
  afficherEcran('screen-lobby');
  document.getElementById('lobby-code').innerText = codeSalle;
  ecouterSalle();
}

async function rejoindrePartie() {
  monPseudo = document.getElementById('pseudo').value.trim();
  codeSalle = document.getElementById('code-join').value.trim();
  if (!monPseudo) return alert("Mets un pseudo !");
  if (codeSalle.length !== 4) return alert("Code à 4 chiffres requis !");
  if (!currentUser) return alert("Connexion en cours...");

  const docRef = db.collection('salles').doc(codeSalle);
  const doc = await docRef.get();

  if (!doc.exists) return alert("Salle introuvable !");
  if (doc.data().etat !== 'lobby') return alert("La partie a déjà commencé !");

  estHote = false;
  await docRef.update({ [`joueurs.${monPseudo}`]: 0 });
  
  afficherEcran('screen-lobby');
  document.getElementById('lobby-code').innerText = codeSalle;
  ecouterSalle();
}

// ==========================================
// 6. SYNCHRONISATION EN TEMPS RÉEL
// ==========================================
function ecouterSalle() {
  if (unsubscribeSalle) unsubscribeSalle();
  
  unsubscribeSalle = db.collection('salles').doc(codeSalle).onSnapshot(doc => {
    if (!doc.exists) return;
    const data = doc.data();

    // Mettre à jour la liste des joueurs
    mettreAJourJoueurs(data.joueurs, data.etat);

    // Logique selon l'état
    if (data.etat === 'lobby') {
      if (estHote) document.getElementById('btn-start').classList.remove('hidden');
    } 
    else if (data.etat === 'playing') {
      if (document.getElementById('screen-lobby').classList.contains('hidden') === false) {
        afficherEcran('screen-game');
        demarrerChronoLocal();
      }
      afficherQuestion(data.questions[data.questionActuelle]);
    }
    else if (data.etat === 'ended') {
      afficherEcran('screen-end');
      afficherFin(data);
    }
  });
}

// ==========================================
// 7. L'HOTE LANCE LA PARTIE
// ==========================================
async function lancerJeu() {
  // Tirage aléatoire de 20 questions dans toute la banque
  let toutesLesQuestions = [];
  for (let prefix in FIELDS) {
    FIELDS[prefix].forEach(q => toutesLesQuestions.push({ prefix, ...q }));
  }
  toutesLesQuestions = toutesLesQuestions.sort(() => Math.random() - 0.5).slice(0, 20);

  await db.collection('salles').doc(codeSalle).update({
    etat: "playing",
    questions: toutesLesQuestions,
    questionActuelle: 0,
    timerStart: Date.now()
  });
}

// ==========================================
// 8. JOUER UNE QUESTION
// ==========================================
function afficherQuestion(q) {
  if (!q) return;
  document.getElementById('prefix').innerText = q.prefix.toUpperCase();
  document.getElementById('definition').innerText = q.def;
}

function demarrerChronoLocal() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(async () => {
    const doc = await db.collection('salles').doc(codeSalle).get();
    if (!doc.exists || doc.data().etat !== 'playing') return clearInterval(timerInterval);
    
    const data = doc.data();
    const tempsEcoule = (Date.now() - data.timerStart) / 1000;
    const tempsRestant = Math.max(0, TEMPS_PAR_QUESTION - tempsEcoule);

    const pourcentage = (tempsRestant / TEMPS_PAR_QUESTION) * 100;
    document.getElementById('timer-fill').style.width = pourcentage + "%";
    document.getElementById('timer-fill').style.background = pourcentage < 30 ? "#ff5252" : "#00e676";
    document.getElementById('timer-text').innerText = Math.ceil(tempsRestant) + "s";

    // Si le temps est écoulé
    if (tempsRestant <= 0 && estHote) {
      clearInterval(timerInterval);
      passerQuestionSuivante(data);
    }
  }, 250);
}

async function soumettreReponse() {
  if (dejaRepondu) return;
  const reponse = document.getElementById('answer').value.trim().toLowerCase();
  if (!reponse) return;

  dejaRepondu = true;
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('answer').disabled = true;

  const docRef = db.collection('salles').doc(codeSalle);
  const doc = await docRef.get();
  const data = doc.data();
  const q = data.questions[data.questionActuelle];

  const normaliser = (txt) => txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  
  if (normaliser(reponse) === normaliser(q.mot)) {
    document.getElementById('msg-game').innerText = "✅ Correct ! +10 pts";
    document.getElementById('msg-game').style.color = "#00e676";
    
    const nouveauScore = (data.joueurs[monPseudo] || 0) + POINTS;
    
    if (nouveauScore >= MAX_POINTS) {
      await docRef.update({
        [`joueurs.${monPseudo}`]: nouveauScore,
        etat: "ended",
        gagnant: monPseudo
      });
    } else {
      await docRef.update({ [`joueurs.${monPseudo}`]: nouveauScore });
      // Le premier qui trouve passe à la question suivante pour tout le monde
      if (estHote) passerQuestionSuivante(data); 
    }
  } else {
    document.getElementById('msg-game').innerText = "❌ Mauvaise réponse.";
    document.getElementById('msg-game').style.color = "#ff5252";
    setTimeout(() => { dejaRepondu = false; document.getElementById('btn-submit').disabled = false; }, 1500);
  }
}

async function passerQuestionSuivante(data) {
  const nextQ = data.questionActuelle + 1;
  
  if (nextQ >= data.questions.length) {
    await db.collection('salles').doc(codeSalle).update({ etat: "ended", gagnant: null });
  } else {
    dejaRepondu = false;
    document.getElementById('btn-submit').disabled = false;
    document.getElementById('answer').disabled = false;
    document.getElementById('answer').value = "";
    document.getElementById('msg-game').innerText = "";

    await db.collection('salles').doc(codeSalle).update({
      questionActuelle: nextQ,
      timerStart: Date.now()
    });
  }
}

// ==========================================
// 9. FONCTIONS D'AFFICHAGE
// ==========================================
function afficherEcran(id) {
  ['screen-home', 'screen-lobby', 'screen-game', 'screen-end'].forEach(ecran => {
    document.getElementById(ecran).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function mettreAJourJoueurs(joueurs, etat) {
  let html = "";
  for (const [nom, score] of Object.entries(joueurs)) {
    html += `<div class="player-card"><span>${nom}</span> <span>${score} pts</span></div>`;
  }
  if (etat === 'lobby') document.getElementById('lobby-players').innerHTML = html;
  else document.getElementById('game-scores').innerHTML = html;
}

function afficherFin(data) {
  if (data.gagnant) {
    document.getElementById('end-title').innerText = `🏆 ${data.gagnant} a gagné avec 200 pts !`;
  } else {
    document.getElementById('end-title').innerText = "Fin de la partie (Plus de questions)";
  }
  
  let html = "";
  for (const [nom, score] of Object.entries(data.joueurs)) {
    html += `<div class="player-card"><span>${nom}</span> <span>${score} pts</span></div>`;
  }
  document.getElementById('end-scores').innerHTML = html;
}
