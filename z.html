<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Membre — Accès Réservé</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #0a0e27;
    --bg2: #131a3a;
    --accent: #00d4ff;
    --accent2: #ff2e88;
    --accent3: #a855f7;
    --gold: #ffd700;
    --text: #e2e8f0;
    --muted: #8892b0;
  }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg1);
    color: var(--text);
    overflow: hidden;
  }

  /* ===== GRILLE ANIMÉE DE FOND ===== */
  .grid-bg {
    position: fixed;
    inset: -50%;
    background-image:
      linear-gradient(rgba(0,212,255,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.08) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(600px) rotateX(60deg);
    animation: gridMove 20s linear infinite;
    z-index: 0;
    opacity: 0.5;
  }
  @keyframes gridMove {
    0%   { transform: perspective(600px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(600px) rotateX(60deg) translateY(50px); }
  }

  /* ===== HALOS ===== */
  .halo {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    opacity: 0.5;
    animation: float 12s ease-in-out infinite;
  }
  .halo-1 { width: 400px; height: 400px; background: var(--accent2); top: -100px; left: -100px; }
  .halo-2 { width: 500px; height: 500px; background: var(--accent3); bottom: -150px; right: -100px; animation-delay: -4s; }
  .halo-3 { width: 300px; height: 300px; background: var(--accent); top: 40%; left: 40%; animation-delay: -8s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -40px) scale(1.15); }
  }

  /* ===== CONTENU ===== */
  .wrap {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ===== CARTE INDISPONIBLE ===== */
  .card {
    text-align: center;
    max-width: 640px;
    width: 100%;
    padding: 55px 45px;
    background: rgba(19, 26, 58, 0.65);
    border: 1px solid rgba(0,212,255,0.25);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 30px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    animation: cardIn 1s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Ligne lumineuse animée en haut */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    border-radius: 2px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== BADGE ===== */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(255,46,136,0.1);
    border: 1px solid rgba(255,46,136,0.4);
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ff8ab8;
    text-transform: uppercase;
    margin-bottom: 30px;
    animation: fadeUp 0.8s ease 0.2s both;
  }
  .badge-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 12px var(--accent2);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.3; transform: scale(0.7); }
  }

  /* ===== TITRE PRINCIPAL ===== */
  .title {
    font-size: clamp(2.8rem, 10vw, 5rem);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 24px;
    color: #fff;
    text-shadow:
      0 0 20px rgba(0,212,255,0.5),
      0 0 40px rgba(168,85,247,0.4);
    animation: fadeUp 0.9s ease 0.35s both;
  }
  .title span {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent3), var(--accent2));
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 4s ease infinite;
  }
  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ===== SOUS-TITRE ===== */
  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--muted);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto 35px;
    animation: fadeUp 1s ease 0.5s both;
  }
  .subtitle strong { color: var(--accent); font-weight: 600; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== BARRE DE PROGRESSION "MAINTENANCE" ===== */
  .progress-wrap {
    margin: 30px auto;
    max-width: 420px;
    animation: fadeUp 1s ease 0.65s both;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .progress-bar {
    height: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 50px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent3), var(--accent2));
    background-size: 200% 100%;
    border-radius: 50px;
    animation: fillBar 8s ease-in-out infinite, gradientMove 3s linear infinite;
    box-shadow: 0 0 20px rgba(0,212,255,0.6);
  }
  @keyframes fillBar {
    0%   { width: 5%; }
    50%  { width: 78%; }
    100% { width: 5%; }
  }

  /* ===== COMPTE À REBOURS ===== */
  .countdown {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 35px 0 25px;
    animation: fadeUp 1s ease 0.8s both;
    flex-wrap: wrap;
  }
  .time-box {
    min-width: 75px;
    padding: 14px 10px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 14px;
    transition: all 0.3s;
  }
  .time-box:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,212,255,0.3);
  }
  .time-num {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px rgba(0,212,255,0.6);
    line-height: 1;
  }
  .time-lbl {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
    font-weight: 600;
  }

  /* ===== BOUTON ===== */
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 30px;
    animation: fadeUp 1s ease 0.95s both;
  }
  .btn {
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    color: #fff;
    box-shadow: 0 8px 25px rgba(0,212,255,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0,212,255,0.6);
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }

  /* ===== FOOTER ===== */
  .foot {
    margin-top: 35px;
    font-size: 0.75rem;
    color: rgba(136,146,176,0.6);
    letter-spacing: 1px;
    animation: fadeUp 1s ease 1.1s both;
  }

  /* ===== MOBILE ===== */
  @media (max-width: 520px) {
    .card { padding: 40px 25px; border-radius: 22px; }
    .title { letter-spacing: -1px; }
    .time-box { min-width: 62px; padding: 10px 6px; }
    .time-num { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="halo halo-1"></div>
<div class="halo halo-2"></div>
<div class="halo halo-3"></div>

<div class="wrap">
  <div class="card">

    <div class="badge">
      <span class="badge-dot"></span>
      Statut système
    </div>

    <h1 class="title"><span>INDISPONIBLE</span></h1>

    <p class="subtitle">
      Cet espace est temporairement <strong>hors ligne</strong> pour une mise à niveau
      de nos serveurs. Nos équipes travaillent pour revenir très vite.
    </p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progression de la maintenance</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

    <div class="countdown">
      <div class="time-box">
        <div class="time-num" id="dd">00</div>
        <div class="time-lbl">Jours</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="hh">00</div>
        <div class="time-lbl">Heures</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="mm">00</div>
        <div class="time-lbl">Minutes</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="ss">00</div>
        <div class="time-lbl">Secondes</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="location.reload()">🔄 Réessayer</button>
      <button class="btn btn-ghost" onclick="alert('Merci de votre patience 🙏')">📩 Me notifier</button>
    </div>

    <div class="foot">© 2026 — Tous droits réservés · Maintenance en cours</div>

  </div>
</div>

<script>
  /* ===== COMPTE À REBOURS ===== */
  // Date cible : dans 3 jours (tu peux changer)
  const target = new Date().getTime() + (3 * 24 * 60 * 60 * 1000) + (7 * 60 * 60 * 1000) + (42 * 60 * 1000);

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date().getTime();
    let diff = target - now;
    if (diff < 0) diff = 0;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('dd').textContent = pad(d);
    document.getElementById('hh').textContent = pad(h);
    document.getElementById('mm').textContent = pad(m);
    document.getElementById('ss').textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);

  /* ===== POURCENTAGE PROGRESSION SYNCHRONISÉ ===== */
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');
  let val = 0, dir = 1;

  setInterval(() => {
    val += dir * 0.7;
    if (val >= 78) { dir = -1; }
    if (val <= 5)  { dir = 1; }
    const shown = Math.round(val);
    fill.style.width = shown + '%';
    pct.textContent = shown + '%';
  }, 60);
</script>
</body>
</html>
