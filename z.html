<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Josef – Quiz multijoueur</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;color:#fff;padding:16px;display:grid;place-items:center}
  .container{max-width:900px;width:100%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
  h1{font-size:clamp(22px,3vw,32px);text-align:center;margin-bottom:20px;text-shadow:0 3px 8px rgba(0,0,0,.3)}
  button{padding:12px 20px;font-size:1rem;font-weight:700;border-radius:12px;border:none;cursor:pointer;background:#fff;color:#2575fc;transition:.2s;box-shadow:0 4px 10px rgba(0,0,0,.1)}
  button:hover:not(:disabled){background:#2575fc;color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  input[type=text]{font-size:1.1rem;padding:12px 14px;border-radius:10px;border:none;width:100%;margin:8px 0;background:#fff;color:#222;outline:none}
  input:focus{box-shadow:0 0 8px #2575fc}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .row>*{flex:1;min-width:140px}
  .hidden{display:none !important}
  .pill{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:.9rem;margin:3px;font-weight:600}
  .status{text-align:center;margin:10px 0;font-weight:600}
  .scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .player-card{background:rgba(0,0,0,.2);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent}
  .player-card.me{border-color:#fff}
  .player-card.winner{border-color:#00e676;background:rgba(0,230,118,.15)}
  .player-name{font-weight:700;font-size:.95rem}
  .player-score{font-size:1.3rem;font-weight:900}
  #questionBox{background:rgba(0,0,0,.18);border-radius:14px;padding:20px;margin:14px 0;text-align:center}
  #prefixBig{font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:.15em;margin-bottom:10px}
  #definitionText{font-size:clamp(16px,2.2vw,20px);line-height:1.5}
  #timerBar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:12px 0}
  #timerFill{height:100%;background:#00e676;width:100%;transition:width .3s linear}
  .timer-danger #timerFill{background:#ff5252}
  #timerText{text-align:center;font-weight:900;font-size:1.2rem;margin-top:4px}
  .big{font-size:clamp(26px,5vw,42px);font-weight:900;text-align:center;margin:20px 0}
  .footnote{text-align:center;opacity:.8;font-size:.85rem;margin-top:16px}
  #msg,#msg2,#msg3{min-height:24px;text-align:center;font-weight:700;margin:8px 0}
  #progressBar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(0,0,0,.2);border-radius:12px;margin:10px 0;font-size:.85rem;font-weight:600;flex-wrap:wrap;gap:8px}
  .code-display{font-family:monospace;font-size:2.5rem;letter-spacing:.3em;text-align:center;margin:12px 0;background:rgba(0,0,0,.3);padding:16px;border-radius:14px;font-weight:900}
</style>
</head>
<body>
<div class="container">
  <h1>🎯 Josef – Quiz multijoueur</h1>

  <!-- ============ ACCUEIL ============ -->
  <div id="screenHome">
    <div class="row"><input id="pseudo" type="text" placeholder="Ton prénom / pseudo" maxlength="16" autocomplete="off" /></div>
    <div class="row">
      <button id="btnCreate">➕ Créer une salle</button>
      <input id="joinCode" type="text" placeholder="Code à 4 chiffres" maxlength="4" inputmode="numeric" style="max-width:180px" />
      <button id="btnJoin">🔗 Rejoindre</button>
    </div>
    <div id="msg"></div>
    <div class="footnote">Crée une salle et partage le code aux autres joueurs</div>
  </div>

  <!-- ============ LOBBY (attente) ============ -->
  <div id="screenLobby" class="hidden">
    <h2 style="text-align:center;margin-bottom:12px">Salle d'attente</h2>
    <p style="text-align:center;opacity:.85">Partage ce code à tes amis :</p>
    <div class="code-display" id="lobbyCode">----</div>
    <p class="status" id="lobbyStatus">Chargement…</p>
    <div class="scoreboard" id="lobbyPlayers"></div>
    <div class="row" id="hostControls">
      <button id="btnStart">🚀 Lancer la partie</button>
    </div>
    <div id="msg2" class="status"></div>
  </div>

  <!-- ============ JEU ============ -->
  <div id="screenGame" class="hidden">
    <div class="status">
      <span class="pill" id="qCounter">Question 1/20</span>
      <span class="pill" id="hostTag"></span>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div id="questionBox">
      <div id="prefixBig">–</div>
      <div id="definitionText">En attente…</div>
    </div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="timerText">30s</div>
    <div id="progressBar">
      <span>📊 Joueurs ayant répondu</span>
      <span><b id="answeredCount">0</b> / <b id="totalPlayers">0</b></span>
    </div>
    <div class="row">
      <input id="answer" type="text" placeholder="Ta réponse…" autocomplete="off" />
      <button id="btnSubmit" style="max-width:140px">Valider</button>
    </div>
    <div id="msg3" class="status"></div>
    <div class="row" id="hostControlsGame">
      <button id="btnHostNext">⏭ Question suivante</button>
      <button id="btnHostEnd">⏹ Terminer</button>
    </div>
  </div>

  <!-- ============ FIN ============ -->
  <div id="screenEnd" class="hidden">
    <div class="big" id="endTitle">Partie terminée</div>
    <div class="scoreboard" id="finalScoreboard"></div>
    <div class="row"><button id="btnLeave">🏠 Retour à l'accueil</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

/* ============================================================
   CONSTANTES
   ============================================================ */
const TOTAL_QUESTIONS = 20;
const POINTS_PER_CORRECT = 10;
const WIN_SCORE = 200;
const QUESTION_DURATION_MS = 30000;

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let uid = null;
let pseudo = '';
let roomCode = null;
let isHost = false;
let unsubscribeRoom = null;
let currentRoom = null;
let timerInterval = null;
let lastAnsweredQ = -1;

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const setMsg = (id, text, color='#fff') => { const el=$(id); if(el){el.textContent=text;el.style.color=color;} };

const normalize = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\-' ]/g,'').trim();

function pickRandomQuestions(n){
  const all = [];
  for (const prefix of Object.keys(FIELDS)) {
    for (const item of FIELDS[prefix]) {
      all.push({ prefix, mot: item.mot, def: item.def });
    }
  }
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, n);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function genCode(){
  return String(Math.floor(1000 + Math.random() * 9000));
}

/* ============================================================
   INIT
   ============================================================ */
async function initAuth(){
  try {
    await auth.signInAnonymously();
    uid = auth.currentUser.uid;
    console.log('✅ Auth OK :', uid);
  } catch(e) {
    console.error(e);
    setMsg('msg', '❌ Auth échouée : ' + e.message, '#ff5252');
  }
}

/* ============================================================
   CRÉER UNE SALLE
   ============================================================ */
async function createRoom(){
  let code = null;
  for (let i = 0; i < 10; i++) {
    const testCode = genCode();
    const snap = await db.collection('rooms').doc(testCode).get();
    if (!snap.exists) { code = testCode; break; }
  }
  if (!code) return setMsg('msg', '❌ Impossible de créer la salle, réessaie.', '#ff5252');

  await db.collection('rooms').doc(code).set({
    state: 'lobby',
    hostName: pseudo,
    players: { [pseudo]: { score: 0, lastAnswerQ: -1, lastWrongQ: -1 } },
    questions: [],
    currentQ: 0,
    qStartAt: 0,
    winnerName: null,
    createdAt: Date.now()
  });
  isHost = true;
  roomCode = code;
  enterLobby();
}

/* ============================================================
   REJOINDRE UNE SALLE
   ============================================================ */
async function joinRoom(code){
  const ref = db.collection('rooms').doc(code);
  const snap = await ref.get();
  if (!snap.exists) return setMsg('msg', '❌ Salle introuvable.', '#ff5252');
  const data = snap.data();
  if (data.state !== 'lobby') return setMsg('msg', '❌ La partie a déjà commencé.', '#ff5252');

  await ref.update({
    [`players.${pseudo}`]: { score: 0, lastAnswerQ: -1, lastWrongQ: -1 }
  });
  isHost = false;
  roomCode = code;
  enterLobby();
}

/* ============================================================
   LOBBY
   ============================================================ */
function enterLobby(){
  hide('screenHome'); show('screenLobby'); hide('screenGame'); hide('screenEnd');
  $('lobbyCode').textContent = roomCode;

  unsubscribeRoom = db.collection('rooms').doc(roomCode).onSnapshot(
    (doc) => {
      if (!doc.exists) return;
      currentRoom = doc.data();
      renderRoom(currentRoom);
    },
    (err) => {
      console.error('❌ Erreur Firestore :', err);
      setMsg('msg2', '❌ Erreur : ' + err.message, '#ff5252');
    }
  );
}

function renderRoom(game){
  if (game.state === 'lobby') {
    hide('screenGame'); hide('screenEnd'); show('screenLobby');
    renderLobby(game);
  } else if (game.state === 'playing') {
    hide('screenLobby'); hide('screenEnd'); show('screenGame');
    renderGame(game);
  } else if (game.state === 'ended') {
    hide('screenLobby'); hide('screenGame'); show('screenEnd');
    renderEnd(game);
  }
}

function renderLobby(game){
  const players = game.players || {};
  const names = Object.keys(players);
  $('lobbyPlayers').innerHTML = names.map(name => `
    <div class="player-card ${name===pseudo?'me':''}">
      <span class="player-name">${escapeHtml(name)}${name===game.hostName?' 👑':''}</span>
      <span class="pill">${name===pseudo?'toi':'prêt'}</span>
    </div>
  `).join('');

  $('hostControls').style.display = game.hostName === pseudo ? 'flex' : 'none';
  $('btnStart').disabled = names.length < 2;
  $('lobbyStatus').textContent = names.length < 2
    ? "⏳ Attends au moins 1 autre joueur…"
    : `✅ ${names.length} joueur(s) prêt(s) — l'hôte peut lancer.`;
}

$('btnStart').addEventListener('click', async () => {
  if (!currentRoom || currentRoom.hostName !== pseudo) return;
  const names = Object.keys(currentRoom.players || {});
  if (names.length < 2) return setMsg('msg2', 'Il faut au moins 2 joueurs.', '#ffb300');
  const questions = pickRandomQuestions(TOTAL_QUESTIONS);
  const updates = {
    state: 'playing',
    currentQ: 0,
    questions,
    qStartAt: Date.now(),
    winnerName: null
  };
  names.forEach(n => {
    updates[`players.${n}.score`] = 0;
    updates[`players.${n}.lastAnswerQ`] = -1;
    updates[`players.${n}.lastWrongQ`] = -1;
  });
  try { await db.collection('rooms').doc(roomCode).update(updates); }
  catch(e){ console.error(e); }
});

/* ============================================================
   JEU
   ============================================================ */
function renderGame(game){
  const players = game.players || {};
  const entries = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $('scoreboard').innerHTML = entries.map(([name,p]) => `
    <div class="player-card ${name===pseudo?'me':''} ${name===game.winnerName?'winner':''}">
      <span class="player-name">${escapeHtml(name)}</span>
      <span class="player-score">${p.score||0}</span>
    </div>
  `).join('');

  let answered = 0;
  for (const name of Object.keys(players)) {
    if (players[name].lastAnswerQ === game.currentQ) answered++;
  }
  $('answeredCount').textContent = answered;
  $('totalPlayers').textContent = Object.keys(players).length;

  const questions = game.questions || [];
  const qIdx = game.currentQ || 0;
  $('qCounter').textContent = `Question ${qIdx+1}/${questions.length}`;
  const q = questions[qIdx];
  if (q) {
    $('prefixBig').textContent = q.prefix.toUpperCase();
    $('definitionText').textContent = q.def;
  }

  $('hostTag').textContent = game.hostName ? `Hôte : ${game.hostName}` : '';
  $('hostControlsGame').style.display = game.hostName === pseudo ? 'flex' : 'none';

  if (qIdx !== lastAnsweredQ) {
    $('answer').disabled = false;
    $('btnSubmit').disabled = false;
  }

  startTimerLoop();
}

function startTimerLoop(){
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!currentRoom || currentRoom.state !== 'playing') return;
    const elapsed = Date.now() - (currentRoom.qStartAt || 0);
    const remain = Math.max(0, QUESTION_DURATION_MS - elapsed);
    const pct = (remain / QUESTION_DURATION_MS) * 100;
    $('timerFill').style.width = pct + '%';
    $('timerText').textContent = Math.ceil(remain/1000) + 's';
    $('timerBar').classList.toggle('timer-danger', remain < 10000);
    if (remain <= 0 && currentRoom.hostName === pseudo) handleTimeout();
  }, 250);
}

async function handleTimeout(){
  if (!currentRoom || currentRoom.state !== 'playing') return;
  if (currentRoom.qStartAt_processed === currentRoom.qStartAt) return;
  const qIdx = currentRoom.currentQ;
  const questions = currentRoom.questions || [];
  const updates = { qStartAt_processed: currentRoom.qStartAt };
  if (qIdx + 1 >= questions.length) {
    updates.state = 'ended';
    updates.winnerName = null;
    updates.endReason = 'out_of_questions';
  } else {
    updates.currentQ = qIdx + 1;
    updates.qStartAt = Date.now();
  }
  try { await db.collection('rooms').doc(roomCode).update(updates); }
  catch(e){ console.error(e); }
}

/* ============================================================
   HÔTE : contrôles en jeu
   ============================================================ */
$('btnHostNext').addEventListener('click', async () => {
  if (!currentRoom || currentRoom.hostName !== pseudo) return;
  const qIdx = currentRoom.currentQ;
  const questions = currentRoom.questions || [];
  const updates = {};
  if (qIdx + 1 >= questions.length) {
    updates.state = 'ended';
    updates.winnerName = null;
    updates.endReason = 'out_of_questions';
  } else {
    updates.currentQ = qIdx + 1;
    updates.qStartAt = Date.now();
  }
  try { await db.collection('rooms').doc(roomCode).update(updates); }
  catch(e){ console.error(e); }
});

$('btnHostEnd').addEventListener('click', async () => {
  if (!currentRoom || currentRoom.hostName !== pseudo) return;
  try {
    await db.collection('rooms').doc(roomCode).update({
      state: 'ended', winnerName: null, endReason: 'manual'
    });
  } catch(e){ console.error(e); }
});

/* ============================================================
   SOUMETTRE
   ============================================================ */
$('btnSubmit').addEventListener('click', submitAnswer);
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(); });

async function submitAnswer(){
  if (!currentRoom || currentRoom.state !== 'playing') return;
  const qIdx = currentRoom.currentQ;
  if (lastAnsweredQ === qIdx) return;
  const userVal = normalize($('answer').value);
  if (!userVal) return;
  const q = currentRoom.questions[qIdx];
  if (!q) return;

  const correct = userVal === normalize(q.mot);
  lastAnsweredQ = qIdx;
  $('answer').disabled = true;
  $('btnSubmit').disabled = true;

  const ref = db.collection('rooms').doc(roomCode);

  if (correct) {
    setMsg('msg3', `✅ Correct ! +${POINTS_PER_CORRECT} pts`, '#00e676');
    const myScore = (currentRoom.players[pseudo]?.score || 0) + POINTS_PER_CORRECT;
    const updates = {
      [`players.${pseudo}.score`]: myScore,
      [`players.${pseudo}.lastAnswerQ`]: qIdx
    };
    if (myScore >= WIN_SCORE) {
      updates.state = 'ended';
      updates.winnerName = pseudo;
    } else if (qIdx + 1 >= currentRoom.questions.length) {
      updates.state = 'ended';
      updates.winnerName = null;
      updates.endReason = 'out_of_questions';
    } else {
      updates.currentQ = qIdx + 1;
      updates.qStartAt = Date.now();
    }
    try { await ref.update(updates); }
    catch(e){ console.error(e); }
  } else {
    setMsg('msg3', `❌ Mauvaise réponse.`, '#ff5252');
    try {
      await ref.update({
        [`players.${pseudo}.lastWrongQ`]: qIdx,
        [`players.${pseudo}.lastAnswerQ`]: qIdx
      });
      const snap = await ref.get();
      const data = snap.data();
      const players = data.players || {};
      const allWrong = Object.keys(players).length > 0 && Object.values(players).every(p => p.lastWrongQ === qIdx);
      if (allWrong) {
        await ref.update({ state: 'ended', winnerName: null, endReason: 'all_wrong' });
      }
    } catch(e){ console.error(e); }
  }
}

/* ============================================================
   FIN
   ============================================================ */
function renderEnd(game){
  const players = game.players || {};
  const entries = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $('finalScoreboard').innerHTML = entries.map(([name,p],i) => `
    <div class="player-card ${name===game.winnerName?'winner':''}">
      <span class="player-name">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '} ${escapeHtml(name)}</span>
      <span class="player-score">${p.score||0}</span>
    </div>
  `).join('');
  if (game.winnerName) {
    $('endTitle').textContent = `🏆 ${game.winnerName} gagne avec ${game.players[game.winnerName].score} pts !`;
  } else {
    $('endTitle').textContent = game.endReason === 'all_wrong' ? "❌ Tout le monde a raté — aucun gagnant" : "⏱ Fin de partie — aucun gagnant";
  }
  if (timerInterval) clearInterval(timerInterval);
}

/* ============================================================
   NAVIGATION ACCUEIL
   ============================================================ */
$('btnCreate').addEventListener('click', async () => {
  const p = $('pseudo').value.trim();
  if (!p) return setMsg('msg', 'Entre un pseudo.', '#ffb300');
  if (!uid) return setMsg('msg', 'Connexion Firebase en cours…', '#ffb300');
  pseudo = p;
  try { await createRoom(); }
  catch(e) { console.error(e); setMsg('msg', '❌ ' + e.message, '#ff5252'); }
});

$('btnJoin').addEventListener('click', async () => {
  const p = $('pseudo').value.trim();
  const code = $('joinCode').value.trim();
  if (!p) return setMsg('msg', 'Entre un pseudo.', '#ffb300');
  if (!/^\d{4}$/.test(code)) return setMsg('msg', 'Code à 4 chiffres requis.', '#ffb300');
  if (!uid) return setMsg('msg', 'Connexion Firebase en cours…', '#ffb300');
  pseudo = p;
  try { await joinRoom(code); }
  catch(e) { console.error(e); setMsg('msg', '❌ ' + e.message, '#ff5252'); }
});

/* ============================================================
   QUITTER
   ============================================================ */
$('btnLeave').addEventListener('click', () => location.reload());

/* ============================================================
   DÉMARRAGE
   ============================================================ */
initAuth();
</script>
