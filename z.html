<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Josef – Quiz Multijoueur</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #f4f4f4;
    --texte: #111111;
    --dore: #cda434;
    --dore-hover: #b8902a;
    --carte: #ffffff;
    --gris: #e0e0e0;
    --msg-rouge: #ef4444;
    --msg-vert: #10b981;
    --carte-verte: #dcfce7;
    --carte-rouge: #fee2e2;
  }

  body.dark-mode {
    --fond: #121212;
    --texte: #f4f4f4;
    --dore: #e5b83b;
    --dore-hover: #f5c84c;
    --carte: #1e1e1e;
    --gris: #333333;
    --msg-rouge: #f87171;
    --msg-vert: #34d399;
    --carte-verte: #064e3b;
    --carte-rouge: #7f1d1d;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family: 'Montserrat', sans-serif;
    background: var(--fond);
    min-height: 100vh; color: var(--texte);
    padding: 16px; display: grid; place-items: center;
    transition: background 0.3s, color 0.3s;
  }
  .container {
    max-width: 900px; width: 100%;
    background: var(--carte);
    border-radius: 20px; padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border-top: 6px solid var(--dore);
    position: relative;
    transition: background 0.3s, border-color 0.3s;
  }

  #themeToggle {
    position: absolute; top: 20px; right: 20px;
    background: var(--gris); border: none; border-radius: 50%;
    width: 44px; height: 44px; cursor: pointer;
    font-size: 1.2rem; display: grid; place-items: center;
    transition: all 0.2s; color: var(--texte);
  }
  #themeToggle:hover { transform: scale(1.1); }

  h1 {
    font-size: clamp(24px, 4vw, 32px);
    text-align: center; margin-bottom: 24px;
    color: var(--texte); font-weight: 900;
    letter-spacing: 1px;
  }
  h2 { text-align: center; color: var(--dore); margin-bottom: 16px; font-size: 1.2rem; }
  
  button {
    padding: 14px 20px; font-size: 1rem; font-weight: 800;
    border-radius: 12px; border: none;
    cursor: pointer; transition: all 0.2s ease;
    font-family: 'Montserrat', sans-serif;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  
  .btn-primaire { background: var(--dore); color: #111; }
  .btn-primaire:hover:not(:disabled) { background: var(--dore-hover); transform: translateY(-2px); }
  
  .btn-secondaire { background: var(--gris); color: var(--texte); }
  .btn-secondaire:hover:not(:disabled) { filter: brightness(0.9); }

  .btn-danger { background: var(--msg-rouge); color: #fff; }
  .btn-danger:hover:not(:disabled) { filter: brightness(0.9); }

  input[type=text] {
    font-size: 1.1rem; padding: 14px 16px; border-radius: 10px;
    border: 2px solid var(--gris); width: 100%; margin: 8px 0;
    background: var(--carte); color: var(--texte); outline: none;
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    transition: border-color 0.2s, background 0.3s, color 0.3s;
  }
  input[type=text]:focus { border-color: var(--dore); }
  
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .row > * { flex: 1; min-width: 140px; }
  .hidden { display: none !important; }
  
  .pill {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    background: var(--gris); font-size: 0.9rem; margin: 3px;
    font-weight: 700; color: var(--texte);
  }
  .status { text-align: center; margin: 12px 0; font-weight: 600; }
  
  .scoreboard {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin: 20px 0;
  }
  .player-card {
    background: var(--fond); border-radius: 12px; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    border: 2px solid var(--gris); transition: all 0.3s ease;
  }
  .player-card.me { border-color: var(--dore); background: var(--carte); }
  .player-card.winner { border-color: var(--dore); background: var(--carte); box-shadow: 0 4px 12px rgba(205, 164, 52, 0.2); }
  
  .player-card.good { background-color: var(--carte-verte) !important; border-color: var(--msg-vert) !important; transform: scale(1.02); }
  .player-card.bad { background-color: var(--carte-rouge) !important; border-color: var(--msg-rouge) !important; }

  .player-name { font-weight: 800; font-size: 1rem; }
  .player-score { font-size: 1.5rem; font-weight: 900; color: var(--dore); }

  #questionBox {
    background: var(--carte); color: var(--texte);
    border-radius: 16px; padding: 30px; margin: 20px 0;
    text-align: center; border: 2px solid var(--dore);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: background 0.3s, color 0.3s;
  }
  #prefixBig {
    font-size: clamp(40px, 8vw, 72px); font-weight: 900;
    letter-spacing: 0.15em; margin-bottom: 16px; color: var(--dore);
    text-transform: uppercase;
  }
  #definitionText { font-size: clamp(18px, 2.5vw, 24px); line-height: 1.5; font-weight: 600; }
  
  #timerBar { height: 14px; background: var(--gris); border-radius: 8px; overflow: hidden; margin: 16px 0; border: 1px solid var(--gris); }
  #timerFill { height: 100%; background: var(--dore); width: 100%; transition: width 0.3s linear; }
  .timer-danger #timerFill { background: var(--msg-rouge); animation: pulse-danger 1s infinite; }
  @keyframes pulse-danger { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  #timerText { text-align: center; font-weight: 900; font-size: 1.4rem; margin-top: 4px; color: var(--dore); }

  #progressBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background: var(--fond); border-radius: 12px;
    margin: 16px 0; font-size: 0.9rem; font-weight: 700; border: 1px solid var(--gris);
  }
  .code-display {
    font-family: monospace; font-size: 2.8rem; letter-spacing: 0.3em;
    text-align: center; margin: 16px 0; background: var(--fond);
    padding: 20px; border-radius: 16px; font-weight: 900;
    color: var(--dore); border: 2px solid var(--gris);
  }
  
  .recap-list { background: var(--fond); border-radius: 12px; padding: 16px; max-height: 300px; overflow-y: auto; margin-top: 16px; border: 1px solid var(--gris); }
  .recap-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gris); font-size: 0.95rem; }
  .recap-item:last-child { border-bottom: none; }
  .recap-good { color: var(--msg-vert); font-weight: 800; }
</style>
</head>
<body>
<div class="container">
  <button id="themeToggle" title="Changer de thème">🌙</button>

  <h1>👑 Josef – Quiz Multijoueur</h1>

  <!-- ACCUEIL -->
  <div id="screenHome">
    <div class="row"><input id="pseudo" type="text" placeholder="Ton prénom / pseudo" maxlength="16" autocomplete="off" /></div>
    <div class="row">
      <button id="btnCreate" class="btn-primaire">Créer une salle</button>
      <input id="joinCode" type="text" placeholder="Code (4 chiffres)" maxlength="4" inputmode="numeric" style="max-width:180px" />
      <button id="btnJoin" class="btn-secondaire">Rejoindre</button>
    </div>
    <div id="msg" style="min-height:24px;text-align:center;font-weight:700;margin:8px 0;"></div>
    <div class="status" style="opacity:0.6; font-size:0.85rem;">Crée une salle et partage le code aux autres joueurs</div>
  </div>

  <!-- LOBBY -->
  <div id="screenLobby" class="hidden">
    <h2>Salle d'attente</h2>
    <p style="text-align:center;margin-bottom:8px;">Partage ce code à tes amis :</p>
    <div class="code-display" id="lobbyCode">----</div>
    <p class="status" id="lobbyStatus">Chargement…</p>
    <div class="scoreboard" id="lobbyPlayers"></div>
    <div class="row" id="hostControls">
      <button id="btnStart" class="btn-primaire">🚀 Lancer la partie</button>
      <button id="btnLobbyLeave" class="btn-danger" style="max-width:180px;">Quitter</button>
    </div>
    <div class="row" id="guestLeave" style="display:none;">
      <button id="btnLobbyLeaveGuest" class="btn-danger">Quitter la salle</button>
    </div>
    <div id="msg2" style="min-height:24px;text-align:center;font-weight:700;margin:8px 0;"></div>
  </div>

  <!-- JEU -->
  <div id="screenGame" class="hidden">
    <div class="status">
      <span class="pill" id="qCounter">Question 1/20</span>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    
    <div id="questionBox">
      <div id="prefixBig">–</div>
      <div id="definitionText">En attente…</div>
      <button id="btnVocal" class="btn-secondaire" style="margin-top:20px; font-size:0.9rem; padding:10px 20px;">🔊 Écouter la définition</button>
    </div>
    
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="timerText">30s</div>

    <div id="progressBar">
      <span>📊 Joueurs ayant répondu</span>
      <span><b id="answeredCount">0</b> / <b id="totalPlayers">0</b></span>
    </div>
    
    <div class="row">
      <input id="answer" type="text" placeholder="Ta réponse…" autocomplete="off" />
      <button id="btnSubmit" class="btn-primaire" style="max-width:120px">Valider</button>
    </div>
    
    <div id="msg3" class="status"></div>

    <div class="row" style="margin-top:16px; border-top: 1px solid var(--gris); padding-top: 16px;">
      <button id="btnGameLeave" class="btn-danger" style="background:transparent; color:var(--msg-rouge); border: 2px solid var(--msg-rouge);">🚪 Quitter la partie</button>
    </div>
  </div>

  <!-- FIN -->
  <div id="screenEnd" class="hidden">
    <div class="status" style="font-size:clamp(24px, 5vw, 36px); font-weight:900; color:var(--dore); margin:20px 0;" id="endTitle">Partie terminée</div>
    <div class="scoreboard" id="finalScoreboard"></div>
    
    <h3 style="text-align:center; margin-top:24px; color:var(--texte);">Récapitulatif des réponses</h3>
    <div class="recap-list" id="recapList"></div>

    <div class="row" style="margin-top:24px;">
      <button id="btnLeave" class="btn-primaire">🏠 Retour à l'accueil</button>
    </div>
  </div>
</div>

/* ============================================================
   CONSTANTES & ÉTAT GLOBAL
   ============================================================ */
const TOTAL_QUESTIONS = 20;
const POINTS_PER_CORRECT = 10;
const QUESTION_DURATION_MS = 30000; // 30 secondes

let uid = null;
let pseudo = localStorage.getItem('josef_pseudo') || '';
let roomCode = null;
let isHost = false;
let unsubscribeRoom = null;
let currentRoom = null;
let timerInterval = null;
let lastAnsweredQ = -1;

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const setMsg = (id, text, color='#111') => { const el=$(id); if(el){el.textContent=text;el.style.color=color;} };
const normalize = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\-' ]/g,'').trim();
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genCode(){ return String(Math.floor(1000 + Math.random() * 9000)); }

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }
}

/* ============================================================
   GESTION DU THÈME
   ============================================================ */
function initTheme() {
  const savedTheme = localStorage.getItem('josef_theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    $('themeToggle').textContent = '☀️';
  }
}

$('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  $('themeToggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('josef_theme', isDark ? 'dark' : 'light');
});

/* ============================================================
   INITIALISATION
   ============================================================ */
async function initAuth(){
  initTheme();
  
  if (pseudo) $('pseudo').value = pseudo;
  
  const savedRoom = localStorage.getItem('josef_room');
  if (savedRoom) {
    try {
      await auth.signInAnonymously();
      uid = auth.currentUser.uid;
      const snap = await db.collection('rooms').doc(savedRoom).get();
      if (snap.exists && snap.data().players[pseudo]) {
        roomCode = savedRoom;
        isHost = (snap.data().hostName === pseudo);
        enterLobby();
        return;
      }
    } catch(e) { console.log("Pas de session précédente"); }
  }

  try {
    await auth.signInAnonymously();
    uid = auth.currentUser.uid;
  } catch(e) {
    console.error(e);
    setMsg('msg', '❌ Auth échouée : ' + e.message, 'var(--msg-rouge)');
  }
}

/* ============================================================
   CRÉATION & CONNEXION SALLE
   ============================================================ */
async function createRoom(){
  let code = null;
  for (let i = 0; i < 10; i++) {
    const testCode = genCode();
    const snap = await db.collection('rooms').doc(testCode).get();
    if (!snap.exists) { code = testCode; break; }
  }
  if (!code) return setMsg('msg', '❌ Impossible de créer la salle.', 'var(--msg-rouge)');

  await db.collection('rooms').doc(code).set({
    state: 'lobby',
    hostName: pseudo,
    players: { [pseudo]: { score: 0, lastAnswerQ: -1, lastWrongQ: -1, correctAnswers: 0, wrongAnswers: 0 } },
    questions: [],
    currentQ: 0,
    qStartAt: 0,
    winnerName: null,
    createdAt: Date.now()
  });
  
  localStorage.setItem('josef_room', code);
  isHost = true;
  roomCode = code;
  enterLobby();
}

async function joinRoom(code){
  const ref = db.collection('rooms').doc(code);
  const snap = await ref.get();
  if (!snap.exists) return setMsg('msg', '❌ Salle introuvable.', 'var(--msg-rouge)');
  const data = snap.data();
  if (data.state !== 'lobby') return setMsg('msg', '❌ La partie a déjà commencé.', 'var(--msg-rouge)');

  if (!data.players[pseudo]) {
    await ref.update({
      [`players.${pseudo}`]: { score: 0, lastAnswerQ: -1, lastWrongQ: -1, correctAnswers: 0, wrongAnswers: 0 }
    });
  }
  
  localStorage.setItem('josef_room', code);
  isHost = false;
  roomCode = code;
  enterLobby();
}

/* ============================================================
   LOBBY
   ============================================================ */
function enterLobby(){
  hide('screenHome'); show('screenLobby'); hide('screenGame'); hide('screenEnd');
  $('lobbyCode').textContent = roomCode;

  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = db.collection('rooms').doc(roomCode).onSnapshot(
    (doc) => {
      if (!doc.exists) return;
      currentRoom = doc.data();
      renderRoom(currentRoom);
    },
    (err) => {
      console.error('❌ Erreur Firestore :', err);
      setMsg('msg2', '❌ Erreur : ' + err.message, 'var(--msg-rouge)');
    }
  );
}

function renderRoom(game){
  if (game.state === 'lobby') {
    hide('screenGame'); hide('screenEnd'); show('screenLobby');
    renderLobby(game);
  } else if (game.state === 'playing') {
    hide('screenLobby'); hide('screenEnd'); show('screenGame');
    renderGame(game);
  } else if (game.state === 'ended') {
    hide('screenLobby'); hide('screenGame'); show('screenEnd');
    renderEnd(game);
  }
}

function renderLobby(game){
  const players = game.players || {};
  const names = Object.keys(players);
  $('lobbyPlayers').innerHTML = names.map(name => `
    <div class="player-card ${name===pseudo?'me':''}">
      <span class="player-name">${escapeHtml(name)}${name===game.hostName?' 👑':''}</span>
      <span class="pill">${name===pseudo?'toi':'prêt'}</span>
    </div>
  `).join('');

  if (game.hostName === pseudo) {
    $('hostControls').style.display = 'flex';
    $('guestLeave').style.display = 'none';
  } else {
    $('hostControls').style.display = 'none';
    $('guestLeave').style.display = 'flex';
  }
  $('btnStart').disabled = names.length < 2;
  $('lobbyStatus').textContent = names.length < 2
    ? "⏳ Attends au moins 1 autre joueur…"
    : `✅ ${names.length} joueur(s) prêt(s) — l'hôte peut lancer.`;
}

$('btnStart').addEventListener('click', async () => {
  if (!currentRoom || currentRoom.hostName !== pseudo) return;
  const names = Object.keys(currentRoom.players || {});
  if (names.length < 2) return setMsg('msg2', 'Il faut au moins 2 joueurs.', 'var(--msg-rouge)');
  
  const historySnap = await db.collection('config').doc('history').get();
  let history = historySnap.exists ? historySnap.data().asked || [] : [];

  let all = [];
  for (const prefix of Object.keys(FIELDS)) {
    for (const item of FIELDS[prefix]) {
      const qId = `${prefix}-${item.mot}`;
      if (!history.includes(qId)) {
        all.push({ id: qId, prefix, mot: item.mot, def: item.def });
      }
    }
  }

  if (all.length < TOTAL_QUESTIONS) {
    history = [];
    all = [];
    for (const prefix of Object.keys(FIELDS)) {
      for (const item of FIELDS[prefix]) {
        all.push({ id: `${prefix}-${item.mot}`, prefix, mot: item.mot, def: item.def });
      }
    }
  }

  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  
  const questions = all.slice(0, TOTAL_QUESTIONS);
  const newAskedIds = questions.map(q => q.id);
  const updatedHistory = [...history, ...newAskedIds];
  await db.collection('config').doc('history').set({ asked: updatedHistory });

  const updates = {
    state: 'playing',
    currentQ: 0,
    questions,
    qStartAt: Date.now(),
    winnerName: null
  };
  names.forEach(n => {
    updates[`players.${n}.score`] = 0;
    updates[`players.${n}.lastAnswerQ`] = -1;
    updates[`players.${n}.lastWrongQ`] = -1;
    updates[`players.${n}.correctAnswers`] = 0;
    updates[`players.${n}.wrongAnswers`] = 0;
  });
  try { await db.collection('rooms').doc(roomCode).update(updates); }
  catch(e){ console.error(e); }
});

/* ============================================================
   JEU
   ============================================================ */
function renderGame(game){
  const players = game.players || {};
  const entries = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  
  $('scoreboard').innerHTML = entries.map(([name,p]) => {
    let stateClass = '';
    if (p.lastAnswerQ === game.currentQ) {
      stateClass = p.lastWrongQ === game.currentQ ? 'bad' : 'good';
    }
    return `
    <div class="player-card ${name===pseudo?'me':''} ${name===game.winnerName?'winner':''} ${stateClass}">
      <span class="player-name">${escapeHtml(name)}</span>
      <span class="player-score">${p.score||0}</span>
    </div>
  `}).join('');

  let answered = 0;
  for (const name of Object.keys(players)) {
    if (players[name].lastAnswerQ === game.currentQ) answered++;
  }
  $('answeredCount').textContent = answered;
  $('totalPlayers').textContent = Object.keys(players).length;

  const questions = game.questions || [];
  const qIdx = game.currentQ || 0;
  $('qCounter').textContent = `Question ${qIdx+1}/${questions.length}`;
  
  const q = questions[qIdx];
  if (q) {
    if (lastAnsweredQ !== qIdx) {
      $('prefixBig').textContent = q.prefix.toUpperCase();
      $('definitionText').textContent = q.def;
      $('answer').value = ""; // Vide le clavier
      $('answer').disabled = false;
      $('btnSubmit').disabled = false;
      setMsg('msg3', '');
      lastAnsweredQ = qIdx;
    }
  }

  startTimerLoop();
}

function startTimerLoop(){
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!currentRoom || currentRoom.state !== 'playing') return;
    const elapsed = Date.now() - (currentRoom.qStartAt || 0);
    const remain = Math.max(0, QUESTION_DURATION_MS - elapsed);
    const pct = (remain / QUESTION_DURATION_MS) * 100;
    $('timerFill').style.width = pct + '%';
    $('timerText').textContent = Math.ceil(remain/1000) + 's';
    $('timerBar').classList.toggle('timer-danger', remain < 5000);
    
    if (remain <= 0 && currentRoom.hostName === pseudo) handleTimeout();
  }, 250);
}

async function handleTimeout(){
  if (!currentRoom || currentRoom.state !== 'playing') return;
  if (currentRoom.qStartAt_processed === currentRoom.qStartAt) return;
  
  const qIdx = currentRoom.currentQ;
  const q = currentRoom.questions[qIdx];
  
  setMsg('msg3', `⏱ Temps écoulé ! La réponse était : ${q.mot}`, 'var(--dore)');
  speak("Temps écoulé. La réponse était " + q.mot);
  
  setTimeout(async () => {
    const questions = currentRoom.questions || [];
    const updates = { qStartAt_processed: currentRoom.qStartAt };
    if (qIdx + 1 >= questions.length) {
      updates.state = 'ended';
      updates.winnerName = null;
    } else {
      updates.currentQ = qIdx + 1;
      updates.qStartAt = Date.now();
    }
    try { await db.collection('rooms').doc(roomCode).update(updates); }
    catch(e){ console.error(e); }
  }, 1000); // 1 seconde
}

/* ============================================================
   SOUMISSION DES RÉPONSES (Joueur)
   ============================================================ */
$('btnSubmit').addEventListener('click', submitAnswer);
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(); });

$('btnVocal').addEventListener('click', () => {
  if (currentRoom && currentRoom.questions) {
    const q = currentRoom.questions[currentRoom.currentQ];
    if (q) speak("Trouvez le mot qui commence par " + q.prefix + ". " + q.def);
  }
});

async function submitAnswer(){
  if (!currentRoom || currentRoom.state !== 'playing' || $('answer').disabled) return;
  const qIdx = currentRoom.currentQ;
  const userVal = normalize($('answer').value);
  if (!userVal) return;
  const q = currentRoom.questions[qIdx];
  if (!q) return;

  const correct = userVal === normalize(q.mot);
  $('answer').disabled = true;
  $('btnSubmit').disabled = true;

  const ref = db.collection('rooms').doc(roomCode);

  if (correct) {
    setMsg('msg3', `✅ Correct ! +${POINTS_PER_CORRECT} pts`, 'var(--msg-vert)');
    speak("Correct !");
    
    const pData = currentRoom.players[pseudo] || { score: 0, correctAnswers: 0 };
    const myScore = (pData.score || 0) + POINTS_PER_CORRECT;
    const myCorrects = (pData.correctAnswers || 0) + 1;

    const updates = {
      [`players.${pseudo}.score`]: myScore,
      [`players.${pseudo}.lastAnswerQ`]: qIdx,
      [`players.${pseudo}.correctAnswers`]: myCorrects
    };
    
    setTimeout(async () => {
      if (qIdx + 1 >= currentRoom.questions.length) {
        updates.state = 'ended';
        updates.winnerName = pseudo;
      } else {
        updates.currentQ = qIdx + 1;
        updates.qStartAt = Date.now();
      }
      try { await ref.update(updates); } catch(e){ console.error(e); }
    }, 1000); // 1 seconde
    
  } else {
    setMsg('msg3', `❌ Mauvaise réponse.`, 'var(--msg-rouge)');
    speak("Mauvaise réponse.");
    
    const pData = currentRoom.players[pseudo] || { wrongAnswers: 0 };
    const myWrongs = (pData.wrongAnswers || 0) + 1;

    try {
      await ref.update({
        [`players.${pseudo}.lastWrongQ`]: qIdx,
        [`players.${pseudo}.lastAnswerQ`]: qIdx,
        [`players.${pseudo}.wrongAnswers`]: myWrongs
      });
      
      const snap = await ref.get();
      const data = snap.data();
      const players = data.players || {};
      const allWrong = Object.keys(players).length > 0 && Object.values(players).every(p => p.lastWrongQ === qIdx);
      
      if (allWrong) {
        setMsg('msg3', `❌ Tout le monde a raté !`, 'var(--dore)');
        speak("Tout le monde a raté.");
        
        setTimeout(async () => {
          const updates = {};
          if (qIdx + 1 >= data.questions.length) {
            updates.state = 'ended';
          } else {
            updates.currentQ = qIdx + 1;
            updates.qStartAt = Date.now();
          }
          await ref.update(updates);
        }, 1000); // 1 seconde
      }
    } catch(e){ console.error(e); }
  }
}

/* ============================================================
   QUITTER LA PARTIE
   ============================================================ */
async function leaveRoom() {
  if (!confirm("Êtes-vous sûr de vouloir quitter ?")) return;

  if (roomCode && pseudo) {
    try {
      await db.collection('rooms').doc(roomCode).update({
        [`players.${pseudo}`]: firebase.firestore.FieldValue.delete()
      });
    } catch(e) { console.error(e); }
  }
  localStorage.removeItem('josef_room');
  location.reload();
}

$('btnLobbyLeave').addEventListener('click', leaveRoom);
$('btnLobbyLeaveGuest').addEventListener('click', leaveRoom);
$('btnGameLeave').addEventListener('click', leaveRoom);

/* ============================================================
   FIN DE PARTIE
   ============================================================ */
function renderEnd(game){
  if (timerInterval) clearInterval(timerInterval);
  
  const players = game.players || {};
  const entries = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  
  const winnerName = entries.length > 0 ? entries[0][0] : null;
  const winnerScore = winnerName ? entries[0][1].score : 0;
  const tied = entries.length > 1 && entries[1][1].score === winnerScore;

  $('finalScoreboard').innerHTML = entries.map(([name,p],i) => `
    <div class="player-card ${name===winnerName && !tied ? 'winner' : ''}">
      <span class="player-name">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '} ${escapeHtml(name)}</span>
      <span class="player-score">${p.score||0} pts (✅ ${p.correctAnswers||0} | ❌ ${p.wrongAnswers||0})</span>
    </div>
  `).join('');
  
  if (tied) {
    $('endTitle').textContent = `🤝 Égalité entre les joueurs à ${winnerScore} pts !`;
  } else if (winnerName) {
    $('endTitle').textContent = `🏆 ${winnerName} gagne avec ${winnerScore} pts !`;
  } else {
    $('endTitle').textContent = "⏱ Fin de partie — aucun gagnant";
  }

  const questions = game.questions || [];
  $('recapList').innerHTML = questions.map((q, i) => `
    <div class="recap-item">
      <span><b>Q${i+1}.</b> (${q.prefix.toUpperCase()}) ${q.mot}</span>
      <span class="recap-good">Réponse</span>
    </div>
  `).join('');
}

/* ============================================================
   NAVIGATION ACCUEIL
   ============================================================ */
$('btnCreate').addEventListener('click', async () => {
  const p = $('pseudo').value.trim();
  if (!p) return setMsg('msg', 'Entre un pseudo.', 'var(--msg-rouge)');
  if (!uid) return setMsg('msg', 'Connexion Firebase en cours…', 'var(--msg-rouge)');
  pseudo = p;
  localStorage.setItem('josef_pseudo', pseudo);
  try { await createRoom(); }
  catch(e) { console.error(e); setMsg('msg', '❌ ' + e.message, 'var(--msg-rouge)'); }
});

$('btnJoin').addEventListener('click', async () => {
  const p = $('pseudo').value.trim();
  const code = $('joinCode').value.trim();
  if (!p) return setMsg('msg', 'Entre un pseudo.', 'var(--msg-rouge)');
  if (!/^\d{4}$/.test(code)) return setMsg('msg', 'Code à 4 chiffres requis.', 'var(--msg-rouge)');
  if (!uid) return setMsg('msg', 'Connexion Firebase en cours…', 'var(--msg-rouge)');
  pseudo = p;
  localStorage.setItem('josef_pseudo', pseudo);
  try { await joinRoom(code); }
  catch(e) { console.error(e); setMsg('msg', '❌ ' + e.message, 'var(--msg-rouge)'); }
});

$('btnLeave').addEventListener('click', () => {
  localStorage.removeItem('josef_room');
  location.reload();
});

/* ============================================================
   DÉMARRAGE
   ============================================================ */
initAuth();
</script>
