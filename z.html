<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Études de Droit — Bibliothèque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#1e3a5f;--primary-light:#2d4a75;
  --bg:#f4f6fa;--surface:#fff;--text:#1a1a2e;--muted:#64748b;
  --border:#e2e8f0;
  --success:#059669;--success-light:#d1fae5;
  --danger:#dc2626;--danger-light:#fee2e2;
  --info:#3b82f6;--info-light:#dbeafe;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.06);
  --grad:linear-gradient(135deg,#1e3a5f 0%,#2d4a75 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
h1,h2,h3{color:var(--primary);letter-spacing:-.02em}
.container{max-width:1200px;margin:0 auto;padding:24px}
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted);font-size:.9rem}

.header{background:var(--grad);color:#fff;padding:20px 0;box-shadow:0 4px 20px rgba(30,58,95,.3);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-text strong{display:block;font-size:1.1rem;color:#fff}
.logo-text small{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:#93c5fd}

.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav-btn{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);padding:9px 16px;border-radius:8px;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.25)}
.nav-btn.active{background:#fff;color:var(--primary)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:8px;border:none;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,58,95,.3)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#047857}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:7px 14px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card-header h2{font-size:1.3rem}

.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad)}
.stat-value{font-size:2.2rem;font-weight:800;color:var(--primary);line-height:1.1}
.stat-label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:6px}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;margin-bottom:6px;color:var(--primary);font-size:.88rem}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--info)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.message{padding:12px 16px;border-radius:8px;margin-top:12px;display:none;font-size:.9rem}
.message.show{display:block}
.message.info{background:var(--info-light);color:#1e40af;border-left:4px solid var(--info)}
.message.success{background:var(--success-light);color:#065f46;border-left:4px solid var(--success)}
.message.error{background:var(--danger-light);color:#991b1b;border-left:4px solid var(--danger)}

.pdf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pdf-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .2s}
.pdf-card:hover{border-color:var(--info);box-shadow:0 4px 12px rgba(59,130,246,.15)}
.pdf-title{font-weight:700;color:var(--primary);margin-bottom:6px;font-size:1rem;word-break:break-word}
.pdf-meta{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.pdf-actions{display:flex;gap:8px;flex-wrap:wrap}

.viewer-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;display:none;flex-direction:column}
.viewer-overlay.show{display:flex}
.viewer-header{background:var(--primary);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.viewer-timer{font-size:1.2rem;font-weight:800;background:rgba(255,255,255,.15);padding:6px 16px;border-radius:8px}
.viewer-content{flex:1;overflow:auto;background:#525659}
.viewer-content iframe{width:100%;height:100%;border:none}

.chart-container{position:relative;height:300px;margin-top:16px}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){
  .form-row{grid-template-columns:1fr}
  .header-inner{flex-direction:column;align-items:stretch}
  .nav{justify-content:center}
}
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <div class="logo">
      <div class="logo-text">
        <strong>⚖️ Mes Études de Droit</strong>
        <small>Bibliothèque & Progrès</small>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn active" data-tab="tab-dashboard">📊 Progrès</button>
      <button class="nav-btn" data-tab="tab-bibliotheque">📚 Bibliothèque</button>
    </div>
  </div>
</header>

<main class="container" style="padding-top:24px">

  <!-- ===== TABLEAU DE BORD ===== -->
  <div id="tab-dashboard" class="tab-content active">
    <h1 style="margin-bottom:20px">Mon évolution</h1>
    <div class="grid-stats">
      <div class="stat-card"><div class="stat-value" id="statTotalTime">0h</div><div class="stat-label">Temps total</div></div>
      <div class="stat-card"><div class="stat-value" id="statWeekTime">0h</div><div class="stat-label">Cette semaine</div></div>
      <div class="stat-card"><div class="stat-value" id="statTodayTime">0min</div><div class="stat-label">Aujourd'hui</div></div>
      <div class="stat-card"><div class="stat-value" id="statPdfCount">0</div><div class="stat-label">Documents</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>📈 Temps d'étude (7 derniers jours)</h2></div>
      <div class="chart-container"><canvas id="chartEvolution"></canvas></div>
    </div>
  </div>

  <!-- ===== BIBLIOTHÈQUE ===== -->
  <div id="tab-bibliotheque" class="tab-content">
    <h1 style="margin-bottom:20px">Ma Bibliothèque</h1>
    <div class="card">
      <div class="card-header"><h2>➕ Ajouter un cours (PDF)</h2></div>
      <div class="form-row">
        <div class="form-group">
          <label>Fichier PDF</label>
          <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="form-group">
          <label>Matière</label>
          <select id="pdfMatiere">
            <option value="Droit civil">Droit civil</option>
            <option value="Droit pénal">Droit pénal</option>
            <option value="Droit constitutionnel">Droit constitutionnel</option>
            <option value="Droit administratif">Droit administratif</option>
            <option value="Droit commercial">Droit commercial</option>
            <option value="Droit international">Droit international</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="btnAddPdf">📥 Enregistrer le cours</button>
      <div id="pdfMsg" class="message"></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>📂 Mes cours (<span id="pdfCount2">0</span>)</h2></div>
      <div id="pdfList" class="pdf-list"><p class="muted center" style="padding:20px">Chargement...</p></div>
    </div>
  </div>

</main>

<!-- ============ VIEWER PDF ============ -->
<div id="viewerOverlay" class="viewer-overlay">
  <div class="viewer-header">
    <div style="display:flex;align-items:center;gap:12px">
      <strong id="viewerTitle" style="font-size:.95rem">Document</strong>
      <span class="viewer-timer">⏱️ <span id="viewerTimer">00:00</span></span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="btnPauseTimer">⏸️ Pause</button>
      <button class="btn btn-sm" style="background:#dc2626;color:#fff" id="btnCloseViewer">✕ Fermer</button>
    </div>
  </div>
  <div class="viewer-content">
    <iframe id="viewerIframe"></iframe>
  </div>
</div>

<script type="module">
// ============================================================
// 1. CONFIGURATION FIREBASE (VOTRE CLÉ)
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8OQxm5BcHOB2dyWCayavNYpGSut4l7W4",
  authDomain: "eeee-1387d.firebaseapp.com",
  projectId: "eeee-1387d",
  storageBucket: "eeee-1387d.firebasestorage.app",
  messagingSenderId: "777961527724",
  appId: "1:777961527724:web:5c222e42be24af0ab38209",
  measurementId: "G-K1C4JRYDXH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================================
// 2. CHARGEMENT DE PDF.JS
// ============================================================
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

// ============================================================
// 3. NAVIGATION & INITIALISATION
// ============================================================
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'tab-dashboard') rafraichirDashboard();
  });
});

// ============================================================
// 4. GESTION DES PDF (FIREBASE)
// ============================================================
const colPdfs = collection(db, "pdfs");
const colTemps = collection(db, "temps");

document.getElementById('btnAddPdf').addEventListener('click', async () => {
  const file = document.getElementById('pdfFile').files[0];
  if (!file) return afficherMsg('pdfMsg', 'Veuillez choisir un PDF.', 'error');
  
  const msg = document.getElementById('pdfMsg');
  msg.className = 'message show info';
  msg.textContent = '📖 Lecture et envoi sur le cloud...';

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer.slice(0)}).promise;
    let texteComplet = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const contenu = await page.getTextContent();
      texteComplet += contenu.items.map(it => it.str).join(' ') + '\n';
    }
    
    const id = 'pdf_' + Date.now();
    await setDoc(doc(db, "pdfs", id), {
      id, nom: file.name, matiere: document.getElementById('pdfMatiere').value,
      taille: file.size, nbPages: pdf.numPages, 
      texte: texteComplet.substring(0, 100000),
      dateAjout: new Date().toISOString()
    });

    msg.className = 'message show success';
    msg.textContent = `✅ Cours enregistré !`;
    document.getElementById('pdfFile').value = '';
    rafraichirBibliotheque();
  } catch (e) {
    console.error(e);
    msg.className = 'message show error';
    msg.textContent = '❌ Erreur : ' + e.message;
  }
});

function afficherMsg(id, texte, type) {
  const el = document.getElementById(id);
  el.className = 'message show ' + type;
  el.textContent = texte;
}

onSnapshot(colPdfs, (snap) => {
  const tousLesCours = [];
  snap.forEach(d => tousLesCours.push(d.data()));
  
  document.getElementById('pdfCount2').textContent = tousLesCours.length;
  document.getElementById('statPdfCount').textContent = tousLesCours.length;
  
  const container = document.getElementById('pdfList');
  if (tousLesCours.length === 0) {
    container.innerHTML = '<p class="muted center" style="padding:20px">Aucun cours. Ajoutez-en un.</p>';
    return;
  }
  
  tousLesCours.sort((a, b) => (a.dateAjout < b.dateAjout ? 1 : -1));
  container.innerHTML = tousLesCours.map(p => `
    <div class="pdf-card">
      <div class="pdf-title">${p.nom}</div>
      <div class="pdf-meta">${p.matiere} · ${p.nbPages} pages</div>
      <div class="pdf-actions">
        <button class="btn btn-primary btn-sm" onclick="ouvrirPDF('${p.id}')">📖 Lire</button>
        <button class="btn btn-danger btn-sm" onclick="supprimerPDF('${p.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
});

window.supprimerPDF = async function(id) {
  if (!confirm('Supprimer ce cours ?')) return;
  await deleteDoc(doc(db, "pdfs", id));
};

// ============================================================
// 5. LECTEUR PDF & CHRONOMÈTRE
// ============================================================
let timerInterval = null;
let timerSecondes = 0;
let timerPaused = false;
let currentPdfId = null;

window.ouvrirPDF = async function(id) {
  const snap = await getDoc(doc(db, "pdfs", id));
  if (!snap.exists()) return;
  const pdf = snap.data();
  
  currentPdfId = id;
  document.getElementById('viewerTitle').textContent = pdf.nom;
  document.getElementById('viewerOverlay').classList.add('show');
  
  // Afficher le texte du PDF dans une iframe
  document.getElementById('viewerIframe').srcdoc = `<html><body style="font-family:sans-serif;padding:40px;line-height:1.8;background:#fff;"><h1>${pdf.nom}</h1><hr><p style="white-space:pre-wrap;">${pdf.texte}</p></body></html>`;
  
  timerSecondes = 0; timerPaused = false;
  document.getElementById('viewerTimer').textContent = '00:00';
  document.getElementById('btnPauseTimer').textContent = '⏸️ Pause';
  
  if (timerInterval) clearInterval(timerInterval);
  
  timerInterval = setInterval(async () => {
    if (timerPaused) return;
    timerSecondes++;
    document.getElementById('viewerTimer').textContent = `${String(Math.floor(timerSecondes/60)).padStart(2,'0')}:${String(timerSecondes%60).padStart(2,'0')}`;
    
    // Sauvegarde toutes les 30 secondes
    if (timerSecondes % 30 === 0) {
      await setDoc(doc(db, "temps", Date.now().toString()), { pdfId: currentPdfId, secondes: 30, date: new Date().toISOString() });
    }
  }, 1000);
};

document.getElementById('btnPauseTimer').onclick = () => {
  timerPaused = !timerPaused;
  document.getElementById('btnPauseTimer').textContent = timerPaused ? '▶️ Reprendre' : '⏸️ Pause';
};

document.getElementById('btnCloseViewer').onclick = async () => {
  if (timerSecondes % 30 > 0) {
    await setDoc(doc(db, "temps", Date.now().toString()), { pdfId: currentPdfId, secondes: timerSecondes % 30, date: new Date().toISOString() });
  }
  clearInterval(timerInterval);
  document.getElementById('viewerIframe').srcdoc = '';
  document.getElementById('viewerOverlay').classList.remove('show');
  rafraichirDashboard();
};

// ============================================================
// 6. TABLEAU DE BORD
// ============================================================
async function rafraichirDashboard() {
  const tempsSnap = await getDocs(colTemps);
  const temps = [];
  tempsSnap.forEach(d => temps.push(d.data()));

  let total = 0, today = 0, week = 0;
  const todayStr = new Date().toISOString().split('T')[0];
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();

  temps.forEach(t => {
    total += t.secondes;
    if (t.date.startsWith(todayStr)) today += t.secondes;
    if (t.date > weekAgo) week += t.secondes;
  });

  document.getElementById('statTotalTime').textContent = (total/3600).toFixed(1) + 'h';
  document.getElementById('statTodayTime').textContent = Math.round(today/60) + 'min';
  document.getElementById('statWeekTime').textContent = (week/3600).toFixed(1) + 'h';

  const ctx = document.getElementById('chartEvolution').getContext('2d');
  if (window.myChart) window.myChart.destroy();
  const labels = [], data = [];
  for(let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    labels.push(d.toLocaleDateString('fr-FR', {weekday:'short'}));
    let sec = 0;
    temps.forEach(t => { if(t.date.startsWith(d.toISOString().split('T')[0])) sec += t.secondes; });
    data.push((sec/60).toFixed(0));
  }
  window.myChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Minutes', data, backgroundColor: '#1e3a5f', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

// Démarrage
rafraichirDashboard();
</script>
</body>
</html>
