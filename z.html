<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Génie du Droit — Co-pilote Ultime</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--surface-light:#334155;
  --primary:#38bdf8;--primary-hover:#0ea5e9;
  --text:#f8fafc;--text-muted:#94a3b8;
  --border:#334155;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.3);
  --transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
h1,h2,h3{color:var(--text);letter-spacing:-.02em}
.container{max-width:1200px;margin:0 auto;padding:24px}
.muted{color:var(--text-muted);font-size:.9rem}
.center{text-align:center}

.header{background:rgba(15,23,42,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:16px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-size:1.5rem}
.logo-text strong{display:block;font-size:1.1rem;color:var(--text)}
.logo-text small{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--primary)}

.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav-btn{background:transparent;color:var(--text-muted);border:1px solid transparent;padding:10px 16px;border-radius:8px;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer;transition:var(--transition)}
.nav-btn:hover{color:var(--text);background:var(--surface)}
.nav-btn.active{background:var(--primary);color:#0f172a;box-shadow:0 0 15px rgba(56,189,248,.4)}
.page{display:none;animation:fadeIn .4s ease-out forwards}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;border:1px solid var(--border);transition:var(--transition)}
.card:hover{border-color:var(--primary);transform:translateY(-2px)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;border:none;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:var(--transition)}
.btn-primary{background:var(--primary);color:#0f172a}
.btn-primary:hover{background:var(--primary-hover);box-shadow:0 0 20px rgba(56,189,248,.5)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 16px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;margin-bottom:8px;color:var(--text-muted);font-size:.85rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;transition:var(--transition)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(56,189,248,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pdf-card{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;transition:var(--transition)}
.pdf-card:hover{border-color:var(--primary)}
.pdf-title{font-weight:700;margin-bottom:8px;color:var(--text)}
.pdf-meta{font-size:.8rem;color:var(--text-muted);margin-bottom:16px}
.pdf-actions{display:flex;gap:8px;flex-wrap:wrap}
.badge-lu{position:absolute;top:-10px;right:-10px;background:var(--success);color:#fff;padding:4px 12px;border-radius:12px;font-size:.75rem;font-weight:700}

/* PLANNING */
.planning-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.week-card{background:var(--surface-light);padding:20px;border-radius:var(--radius);border-left:4px solid var(--primary)}
.week-card h3{font-size:1rem;margin-bottom:12px;display:flex;justify-content:space-between}
.pdf-item{padding:10px;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.pdf-item:last-child{border-bottom:none}

/* FLASHCARDS */
.flashcard-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.flashcard{perspective:1000px;cursor:pointer;height:200px}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface-light);border:2px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:1.05rem;box-shadow:var(--shadow)}
.flashcard-back{transform:rotateY(180deg);background:rgba(56,189,248,.1);border-color:var(--primary);font-weight:400}

.message{padding:12px;border-radius:8px;margin-top:12px;display:none;font-size:.9rem}
.message.show{display:block}
.message.success{background:rgba(16,185,129,.1);border-left:4px solid var(--success);color:var(--success)}
.message.error{background:rgba(239,68,68,.1);border-left:4px solid var(--danger);color:var(--danger)}

/* LECTEUR PRO */
.viewer-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:1000;display:none;flex-direction:column}
.viewer-overlay.show{display:flex}
.viewer-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.viewer-title{font-weight:700;color:var(--primary);font-size:1.1rem}
.viewer-controls{display:flex;gap:8px;align-items:center;background:var(--bg);padding:6px;border-radius:12px;border:1px solid var(--border)}
.viewer-controls select{background:var(--surface);color:var(--text);border:none;padding:8px;border-radius:6px;font-weight:600;outline:none}
.viewer-content{flex:1;overflow-y:auto;background:var(--bg);padding:32px 16px;display:flex;flex-direction:column;align-items:center}
.viewer-page{background:#fff;color:#1a1a2e;max-width:800px;width:100%;padding:40px;border-radius:12px;font-family:serif;font-size:1.15rem;line-height:1.8;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:pre-wrap;margin-bottom:24px;position:relative}
.viewer-footer{background:var(--surface);border-top:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <div class="logo">
      <span class="logo-icon">⚖️</span>
      <div class="logo-text"><strong>Génie du Droit</strong><small>Co-pilote Ultime</small></div>
    </div>
    <div class="nav">
      <button class="nav-btn active" data-page="page-biblio">📚 Bibliothèque</button>
      <button class="nav-btn" data-page="page-planning">📅 Planning</button>
      <button class="nav-btn" data-page="page-flash">🗂️ Flashcards</button>
      <button class="nav-btn" data-page="page-add">➕ Ajouter un PDF</button>
    </div>
  </div>
</header>

<main class="container" style="padding-top:32px">
  
  <!-- BIBLIOTHÈQUE -->
  <div id="page-biblio" class="page active">
    <h1 style="margin-bottom:24px">Ma Bibliothèque</h1>
    <div id="pdfList" class="pdf-grid">
      <p class="muted center" style="grid-column:1/-1">Chargement...</p>
    </div>
  </div>

  <!-- PLANNING -->
  <div id="page-planning" class="page">
    <h1 style="margin-bottom:24px">Mon Planning</h1>
    <div class="planning-grid">
      <div class="week-card">
        <h3>Cette semaine <span style="color:var(--primary)">En cours</span></h3>
        <div id="weekCurrent"><p class="muted">Aucun cours.</p></div>
      </div>
      <div class="week-card">
        <h3>Semaine prochaine <span style="color:var(--warning)">À venir</span></h3>
        <div id="weekNext"><p class="muted">Aucun cours.</p></div>
      </div>
    </div>
    <div class="card" style="margin-top:24px">
      <h3 style="margin-bottom:16px">Assigner un cours à une semaine</h3>
      <div class="form-row">
        <div class="form-group">
          <select id="planPdf"></select>
        </div>
        <div class="form-group">
          <select id="planWeek">
            <option value="current">Cette semaine</option>
            <option value="next">Semaine prochaine</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="ajouterPlanning()">Ajouter au planning</button>
    </div>
  </div>

  <!-- FLASHCARDS -->
  <div id="page-flash" class="page">
    <h1 style="margin-bottom:24px">Mes Flashcards</h1>
    <div class="card">
      <h3 style="margin-bottom:16px">Créer une nouvelle carte</h3>
      <div class="form-row">
        <div class="form-group"><label>Recto (Question)</label><input type="text" id="flashRecto" placeholder="Ex: Qu'est-ce que la responsabilité civile ?"></div>
        <div class="form-group"><label>Verso (Réponse)</label><input type="text" id="flashVerso" placeholder="Ex: L'obligation de réparer le dommage causé à autrui."></div>
      </div>
      <button class="btn btn-success" onclick="creerFlashcard()">Créer la carte</button>
    </div>
    <div class="flashcard-container" id="flashList"></div>
  </div>

  <!-- AJOUT PDF -->
  <div id="page-add" class="page">
    <h1 style="margin-bottom:24px">Ajouter un cours</h1>
    <div class="card">
      <div class="form-group">
        <label>Fichier PDF</label>
        <input type="file" id="pdfFile" accept="application/pdf">
      </div>
      <div class="form-group">
        <label>Matière</label>
        <select id="pdfMatiere">
          <option value="Droit civil">Droit civil</option>
          <option value="Droit pénal">Droit pénal</option>
          <option value="Droit constitutionnel">Droit constitutionnel</option>
          <option value="Droit administratif">Droit administratif</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnAddPdf" style="width:100%">📥 Enregistrer le cours</button>
      <div id="pdfMsg" class="message"></div>
    </div>
  </div>

</main>

<!-- LECTEUR PRO OVERLAY -->
<div id="viewerOverlay" class="viewer-overlay">
  <div class="viewer-header">
    <div class="viewer-title" id="viewerTitle">Document</div>
    <div class="viewer-controls">
      <button class="btn btn-sm btn-primary" id="btnReadAloud">▶️ Écouter</button>
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="stopAudio()">⏹️ Stop</button>
      <select id="speedSelect">
        <option value="0.6">0.6x (Très lent)</option>
        <option value="0.8" selected>0.8x (Lent)</option>
        <option value="1">1x (Normal)</option>
        <option value="1.2">1.2x (Rapide)</option>
      </select>
    </div>
    <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="fermerLecteur()">✕ Fermer</button>
  </div>
  
  <div class="viewer-content" id="viewerContent"></div>
  
  <div class="viewer-footer">
    <div class="muted" id="progressionText">Page 1 / 1</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="exportTexteChatGPT()">📋 Copier pour ChatGPT</button>
      <button class="btn btn-success" id="btnMarquerLu">✅ Marquer comme lu</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

const firebaseConfig = {
  apiKey: "AIzaSyA8OQxm5BcHOB2dyWCayavNYpGSut4l7W4",
  authDomain: "eeee-1387d.firebaseapp.com",
  projectId: "eeee-1387d",
  storageBucket: "eeee-1387d.firebasestorage.app",
  messagingSenderId: "777961527724",
  appId: "1:777961527724:web:5c222e42be24af0ab38209"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colPdfs = collection(db, "pdfs");
const colFlash = collection(db, "flashcards");
const colPlan = collection(db, "planning");

// --- NAVIGATION ---
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.page).classList.add('active');
    if(btn.dataset.page === 'page-planning') updatePlanning();
    if(btn.dataset.page === 'page-flash') updateFlashcards();
  });
});

// --- AJOUT PDF & DECOUPAGE INTELLIGENT ---
document.getElementById('btnAddPdf').onclick = async () => {
  const file = document.getElementById('pdfFile').files[0];
  if (!file) return;
  const msg = document.getElementById('pdfMsg');
  msg.className = 'message show'; msg.textContent = 'Extraction en cours... (Patientez pour les gros PDF)';
  
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer.slice(0)}).promise;
    let fullText = '';
    
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(it => it.str).join(' ') + '\n\n';
    }
    
    // Découpage en pages de 1500 caractères
    const pages = [];
    let currentPageText = '';
    const words = fullText.split(' ');
    
    for (let word of words) {
      currentPageText += word + ' ';
      if (currentPageText.length > 1500) {
        pages.push(currentPageText.trim());
        currentPageText = '';
      }
    }
    if (currentPageText) pages.push(currentPageText.trim());

    const id = 'pdf_' + Date.now();
    await setDoc(doc(db, "pdfs", id), { 
      id, nom: file.name, matiere: document.getElementById('pdfMatiere').value, 
      pages: pages, totalPages: pages.length, isLu: false, dernierePage: 0, dateAjout: new Date().toISOString() 
    });
    
    msg.className = 'message show success'; msg.textContent = '✅ Cours ajouté !';
    document.getElementById('pdfFile').value = '';
    document.querySelector('.nav-btn[data-page="page-biblio"]').click();
  } catch (e) { 
    msg.className = 'message show error'; msg.textContent = '❌ Erreur : ' + e.message; 
  }
};

// --- BIBLIOTHÈQUE ---
onSnapshot(colPdfs, (snap) => {
  const pdfs = []; snap.forEach(d => pdfs.push(d.data()));
  const container = document.getElementById('pdfList');
  
  if (pdfs.length === 0) {
    container.innerHTML = '<p class="muted center" style="grid-column:1/-1">Aucun cours.</p>';
    return;
  }
  
  pdfs.sort((a, b) => b.dateAjout.localeCompare(a.dateAjout));
  container.innerHTML = pdfs.map(p => {
    const badgeLu = p.isLu ? '<div class="badge-lu">Lu ✅</div>' : '';
    const progress = p.dernierePage > 0 && !p.isLu ? `Page ${p.dernierePage} / ${p.totalPages}` : `${p.totalPages} pages`;
    return `
      <div class="pdf-card">
        ${badgeLu}
        <div class="pdf-title">${p.nom}</div>
        <div class="pdf-meta">${p.matiere} · ${progress}</div>
        <div class="pdf-actions">
          <button class="btn btn-primary btn-sm" onclick="ouvrirLecteur('${p.id}')">📖 Lire</button>
          <button class="btn btn-danger btn-sm" onclick="supprimerPDF('${p.id}')">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
  
  const opts = pdfs.map(p => `<option value="${p.id}">${p.nom}</option>`).join('');
  document.getElementById('planPdf').innerHTML = opts;
});
window.supprimerPDF = async (id) => { if(confirm('Supprimer ?')) await deleteDoc(doc(db, "pdfs", id)); };

// --- LECTEUR PRO & AUDIO ---
let currentPdf = null;
let currentPageIndex = 0;
let isReading = false;
let speechQueue = [];

window.ouvrirLecteur = async function(id) {
  const snap = await getDoc(doc(db, "pdfs", id));
  if (!snap.exists()) return;
  currentPdf = snap.data();
  
  document.getElementById('viewerTitle').textContent = currentPdf.nom;
  document.getElementById('btnMarquerLu').style.display = currentPdf.isLu ? 'none' : 'inline-flex';
  currentPageIndex = currentPdf.dernierePage || 0;
  
  renderPage();
  document.getElementById('viewerOverlay').classList.add('show');
};

function renderPage() {
  const container = document.getElementById('viewerContent');
  const text = currentPdf.pages[currentPageIndex];
  container.innerHTML = `<div class="viewer-page"><div style="position:absolute;top:16px;right:16px;font-size:.8rem;color:#94a3b8">Page ${currentPageIndex + 1} / ${currentPdf.totalPages}</div>${text}</div>`;
  document.getElementById('progressionText').textContent = `Page ${currentPageIndex + 1} / ${currentPdf.totalPages}`;
  container.scrollTop = 0;
  
  if (currentPdf.dernierePage !== currentPageIndex) {
    updateDoc(doc(db, "pdfs", currentPdf.id), { dernierePage: currentPageIndex });
    currentPdf.dernierePage = currentPageIndex;
  }
  if (isReading) stopAudio();
}

document.getElementById('viewerContent').addEventListener('scroll', (e) => {
  const el = e.target;
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50) {
    if (currentPageIndex < currentPdf.totalPages - 1 && !isReading) {
      setTimeout(() => { currentPageIndex++; renderPage(); }, 800);
    }
  }
});

document.getElementById('btnMarquerLu').onclick = async () => {
  if (!currentPdf) return;
  await updateDoc(doc(db, "pdfs", currentPdf.id), { isLu: true });
  alert('🎉 Félicitations, cours terminé !');
  fermerLecteur();
};

window.fermerLecteur = () => {
  stopAudio();
  document.getElementById('viewerOverlay').classList.remove('show');
  currentPdf = null;
};

// --- AUDIO ANTI-PLANTAGE ---
const btnRead = document.getElementById('btnReadAloud');
btnRead.onclick = () => { if (isReading) stopAudio(); else startAudio(); };

function startAudio() {
  if (!currentPdf) return;
  isReading = true;
  btnRead.innerHTML = '⏸️ Pause';
  speechQueue = currentPdf.pages[currentPageIndex].split('. ').map(s => s.trim()).filter(s => s.length > 0);
  playNextInQueue();
}

function playNextInQueue() {
  if (!isReading || speechQueue.length === 0) {
    if (speechQueue.length === 0 && currentPageIndex < currentPdf.totalPages - 1) {
      currentPageIndex++;
      renderPage();
      startAudio();
    } else {
      stopAudio();
    }
    return;
  }
  const text = speechQueue.shift();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  utterance.rate = parseFloat(document.getElementById('speedSelect').value);
  utterance.onend = () => { if (isReading) playNextInQueue(); };
  utterance.onerror = () => { if (isReading) playNextInQueue(); };
  window.speechSynthesis.speak(utterance);
}

window.stopAudio = () => {
  isReading = false;
  speechQueue = [];
  window.speechSynthesis.cancel();
  btnRead.innerHTML = '▶️ Écouter';
};

// --- EXPORT CHATGPT ---
window.exportTexteChatGPT = async () => {
  if (!currentPdf) return;
  const fullText = currentPdf.pages.join(' ');
  const prompt = `Voici mon cours de droit. Génère-moi 10 questions QCM et 2 cas pratiques avec corrections.\n\n${fullText}`;
  navigator.clipboard.writeText(prompt);
  alert('✅ Texte copié ! Colle-le dans ChatGPT.');
};

// --- FLASHCARDS ---
async function updateFlashcards() {
  const snap = await getDocs(colFlash);
  const cards = []; snap.forEach(d => cards.push(d.data()));
  const container = document.getElementById('flashList');
  
  if (cards.length === 0) {
    container.innerHTML = '<p class="muted center" style="grid-column:1/-1">Aucune flashcard.</p>';
    return;
  }
  
  container.innerHTML = cards.map(c => `
    <div class="flashcard" onclick="this.classList.toggle('flipped')">
      <div class="flashcard-inner">
        <div class="flashcard-front">${c.recto}</div>
        <div class="flashcard-back">${c.verso}</div>
      </div>
    </div>
  `).join('');
}

window.creerFlashcard = async () => {
  const recto = document.getElementById('flashRecto').value.trim();
  const verso = document.getElementById('flashVerso').value.trim();
  if (!recto || !verso) return alert('Remplissez les deux champs.');
  
  await setDoc(doc(db, "flashcards", Date.now().toString()), { recto, verso, date: new Date().toISOString() });
  document.getElementById('flashRecto').value = '';
  document.getElementById('flashVerso').value = '';
  updateFlashcards();
};

// --- PLANNING ---
async function updatePlanning() {
  const plans = []; (await getDocs(colPlan)).forEach(d => plans.push(d.data()));
  const pdfs = []; (await getDocs(colPdfs)).forEach(d => pdfs.push(d.data()));
  
  const current = plans.filter(p => p.week === 'current');
  const next = plans.filter(p => p.week === 'next');
  
  const renderList = (list) => list.length === 0 ? '<p class="muted">Aucun cours prévu.</p>' : 
    list.map(p => {
      const pdf = pdfs.find(x => x.id === p.pdfId);
      return `<div class="pdf-item"><span>📄 ${pdf ? pdf.nom : 'Inconnu'}</span><button class="btn btn-danger btn-sm" style="padding:2px 8px" onclick="supprimerPlan('${p.pdfId}_${p.week}')">✕</button></div>`;
    }).join('');
    
  document.getElementById('weekCurrent').innerHTML = renderList(current);
  document.getElementById('weekNext').innerHTML = renderList(next);
}

window.ajouterPlanning = async () => {
  const pdfId = document.getElementById('planPdf').value;
  const week = document.getElementById('planWeek').value;
  if (!pdfId) return;
  await setDoc(doc(db, "planning", pdfId + "_" + week), { pdfId, week, date: new Date().toISOString() });
  updatePlanning();
};

window.supprimerPlan = async (id) => { await deleteDoc(doc(db, "planning", id)); updatePlanning(); };
</script>
</body>
