<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya Coach — Maître du Jeu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding:24px 16px 40px;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    font-family:'Segoe UI',system-ui,sans-serif;color:#e8f0ff;overflow-x:hidden;
  }
  h1{font-size:1.6rem;margin-bottom:4px;background:linear-gradient(90deg,#4fc3f7,#ce93d8);
     -webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
  .sub{font-size:.9rem;opacity:.75;margin-bottom:18px;text-align:center}

  /* Avatar */
  .coach{position:relative;width:150px;height:180px;animation:float 3s ease-in-out infinite;margin-bottom:10px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:90px;
        background:radial-gradient(circle at 35% 30%,#ffe0b2,#ffb74d);border-radius:50%;
        box-shadow:0 0 40px rgba(255,200,120,.35)}
  .eye{position:absolute;top:34px;width:13px;height:13px;background:#2a1a0a;border-radius:50%;animation:blink 4s infinite}
  .eye.l{left:22px}.eye.r{right:22px}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .mouth{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:28px;height:7px;
         background:#8d4a2a;border-radius:0 0 20px 20px;transition:all .15s}
  .mouth.talk{height:18px;width:22px;border-radius:50%;animation:talk .18s infinite alternate}
  @keyframes talk{from{height:7px}to{height:20px}}
  .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:110px;height:85px;
        background:linear-gradient(180deg,#b39ddb,#6a1b9a);border-radius:55px 55px 18px 18px;
        box-shadow:0 10px 30px rgba(106,27,154,.5)}
  .hat{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;
       border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:34px solid #4a148c;
       filter:drop-shadow(0 0 8px rgba(179,157,219,.6))}
  .ring{position:absolute;top:50%;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;
        border:2px solid rgba(179,157,219,.5);border-radius:50%;opacity:0;pointer-events:none}
  .ring.on{animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.6);opacity:0}}

  /* Panneau */
  .panel{width:min(720px,94vw);display:flex;flex-direction:column;gap:12px}
  .bubble{min-height:70px;padding:14px 18px;background:rgba(255,255,255,.08);
          border:1px solid rgba(255,255,255,.15);border-radius:16px;backdrop-filter:blur(8px);
          font-size:1rem;line-height:1.5;text-align:center}
  .prefix{font-size:2rem;font-weight:900;letter-spacing:.2em;text-align:center;color:#ce93d8;
          text-shadow:0 0 14px rgba(206,147,216,.6);min-height:2.4rem}
  .timer{font-size:2.2rem;font-weight:800;text-align:center;color:#4fc3f7;min-height:2.6rem;
         transition:color .2s}
  .timer.hot{color:#ff5252;animation:shake .3s infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button{padding:12px;font-size:1rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;
         background:linear-gradient(135deg,#4fc3f7,#81d4fa);color:#0a1628;
         transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(79,195,247,.35)}
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.purple{background:linear-gradient(135deg,#ce93d8,#ab47bc);color:#1a0a20;
                box-shadow:0 4px 14px rgba(206,147,216,.35)}

  /* Mode question */
  .ask{display:flex;gap:8px;margin-top:6px}
  .ask input{flex:1;padding:12px 14px;border-radius:12px;border:none;font-size:1rem;
             background:rgba(255,255,255,.92);color:#111;outline:none}
  .ask input:focus{box-shadow:0 0 0 2px #ce93d8}
  .ask button{flex:0 0 auto;padding:12px 18px}

  .small{font-size:.82rem;opacity:.7;text-align:center;margin-top:8px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);
         font-size:.75rem;margin:0 3px}
</style>

<body>

  <h1>Ya Coach — Maître du Jeu</h1>
  <div class="sub">Champ lexical · 4 secondes de réflexion · réponse vocale</div>

  <div class="coach">
    <div class="ring" id="ring"></div>
    <div class="head">
      <div class="hat"></div>
      <div class="eye l"></div><div class="eye r"></div>

    </div>
    <div class="body"></div>
  </div>

    <div class="timer" id="timer">4</div>

    <div class="controls">
      <button id="btnStart">▶ Démarrer</button>
      <button id="btnNext" class="purple">⏭ Suivant</button>
      <button id="btnStop">⏹ Stop</button>
    </div>

    <div class="ask">
      <input id="askInput" placeholder="Ou pose une question (ex : c'est quoi la méthode des loci ?)">
      <button id="btnAsk" class="purple">Demander</button>
    </div>

    <div class="small">
      <span class="badge">Voix chill</span>
      <span class="badge">4 s de réflexion</span>
      <span class="badge">Champs lexicaux</span>
    </div>
  </div>

   2) BASE DE CONNAISSANCES (questions libres)
   ============================================================ */
const KNOWLEDGE = [
  {q:["methode des loci","loci","palais de memoire"], a:"La méthode des loci consiste à associer chaque mot à un lieu familier. Tu imagines un parcours dans ta maison, et tu places chaque mot à un endroit précis. Pour le retrouver, tu refais mentalement le trajet."},
  {q:["repetition espacee","espacee"], a:"La répétition espacée : tu révises un mot à intervalles croissants (J+1, J+3, J+7, J+15). C'est la technique la plus efficace pour la mémoire à long terme."},
  {q:["segmentation","segmenter"], a:"La segmentation : tu découpes un mot long en morceaux mémorisables. Exemple : 'anticonstitutionnellement' → anti / constitution / nellement."},
  {q:["association d'images","image mentale","association d images"], a:"L'association d'images : tu crées une image mentale bizarre ou drôle pour chaque mot difficile. Plus l'image est étrange, mieux tu la retiens."},
  {q:["clan nodasa","nodasa"], a:"Le Clan Nodasa est une académie d'excellence centrée sur la dictée, l'épellation et les champs lexicaux bibliques. Son but : former des champions de la parole et de l'écrit."},
  {q:["diction","epellation","dictee"], a:"En dictée/épellation, les 3 piliers sont : 1) la mémoire visuelle des mots, 2) la maîtrise des règles (accords, accents), 3) l'entraînement régulier avec répétition espacée."},
  {q:["champ lexical","champs lexicaux"], a:"Un champ lexical regroupe des mots autour d'une même idée ou d'un même préfixe. Ici, les mots d'un champ partagent leurs 2 premières lettres."},
  {q:["qui es tu","ton nom","ya coach"], a:"Je suis Ya Coach, le maître du jeu. Je connais les champs lexicaux, la dictée, l'épellation, et je forme les meilleurs coachs du Clan Nodasa."},
  {q:["former un coach","former des coachs","formation"], a:"Pour former un coach : 1) maîtriser les 10 techniques de mémorisation, 2) connaître les champs lexicaux, 3) savoir animer une séance de 4 secondes de réflexion, 4) corriger avec bienveillance, 5) répéter chaque jour."},
  {q:["4 secondes","quatre secondes","reflexion"], a:"Je lis la définition, je laisse 4 secondes de réflexion silencieuse, puis j'annonce la réponse. C'est le rythme du maître du jeu."}

/* ============================================================
   3) VOIX + AVATAR
   ============================================================ */
const mouth = document.getElementById('mouth');
const ring = document.getElementById('ring');
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  voice = v.find(x=>x.lang.startsWith('fr') && /thomas|paul|male|homme/i.test(x.name))
       || v.find(x=>x.lang.startsWith('fr')) || v[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text, cb){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang='fr-FR'; u.rate=0.92; u.pitch=0.95; u.volume=1;
  u.onstart=()=>{mouth.classList.add('talk');ring.classList.add('on');};
  u.onend=()=>{mouth.classList.remove('talk');ring.classList.remove('on'); if(cb)cb();};
  u.onerror=()=>{mouth.classList.remove('talk');ring.classList.remove('on'); if(cb)cb();};
  speechSynthesis.speak(u);
}

/* ============================================================
   4) MOTEUR DE JEU
   ============================================================ */
const $ = id => document.getElementById(id);
const prefixEl=$('prefix'), bubble=$('bubble'), timerEl=$('timer');
const btnStart=$('btnStart'), btnNext=$('btnNext'), btnStop=$('btnStop');

let keys=[], kIdx=0, mIdx=0, state='idle', timerId=null, countdown=4;

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

function resetUI(){
  clearInterval(timerId); timerId=null; state='idle';
  timerEl.textContent='4'; timerEl.classList.remove('hot');
  btnStart.disabled=false; btnNext.disabled=true;
}

function startGame(){
  keys = Object.keys(FIELDS);
  kIdx=0; mIdx=0; state='running';
  btnStart.disabled=true; btnNext.disabled=false;
  nextRound(true);
}

function nextRound(first=false){
  if(state!=='running') return;
  clearInterval(timerId); timerId=null;
  timerEl.classList.remove('hot'); timerEl.textContent='4';

  const key = keys[kIdx];
  const list = FIELDS[key];
  const item = list[mIdx];

  prefixEl.textContent = key;
  bubble.textContent = 'Définition : ' + item.def;
  btnNext.disabled = true;

  const intro = "Champ " + key + ". " + item.def;
  speak(intro, ()=>runCountdown(key, item));
}

function runCountdown(key, item){
  countdown = 4;
  timerEl.textContent = countdown;
  timerEl.classList.remove('hot');

  timerId = setInterval(()=>{
    countdown--;
    timerEl.textContent = countdown;
    if(countdown<=1) timerEl.classList.add('hot');
    if(countdown<=0){
      clearInterval(timerId); timerId=null;
      reveal(key, item);
    }
  },1000);
}

function reveal(key, item){
  bubble.textContent = '✅ Réponse : ' + item.mot + ' — ' + item.def;
  timerEl.textContent = '✔';
  timerEl.classList.remove('hot');
  speak("La réponse est : " + item.mot, ()=>{
    // prépare la suite
    mIdx++;
    if(mIdx >= FIELDS[key].length){ mIdx=0; kIdx++; }
    if(kIdx >= keys.length){ kIdx=0; }
    btnNext.disabled=false;
  });
}

btnStart.addEventListener('click', ()=>{ resetUI(); startGame(); });
btnNext.addEventListener('click', ()=>{ if(state==='running'){ clearInterval(timerId); nextRound(); } });
btnStop.addEventListener('click', ()=>{ resetUI(); speechSynthesis.cancel(); bubble.textContent='Jeu arrêté. Appuie sur « Démarrer » pour rejouer.'; prefixEl.textContent='--'; });

/* ============================================================
   5) MODE QUESTION LIBRE (mots-clés)
   ============================================================ */
$('btnAsk').addEventListener('click', ask);
$('askInput').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });

function ask(){
  const raw = $('askInput').value.trim();
  if(!raw) return;
  const q = normalize(raw);

  // 1) chercher dans KNOWLEDGE
  let best=null, bestScore=0;
  for(const k of KNOWLEDGE){
    for(const kw of k.q){
      const nkw = normalize(kw);
      if(q.includes(nkw)){
        const score = nkw.length;
        if(score>bestScore){ bestScore=score; best=k; }
      }
    }
  }
  if(best){
    bubble.textContent = best.a;
    speak(best.a);
    return;
  }

  // 2) chercher un mot dans les champs
  for(const key of Object.keys(FIELDS)){
    for(const it of FIELDS[key]){
      if(q.includes(normalize(it.mot))){
        const rep = it.mot + " : " + it.def;
        bubble.textContent = rep;
        speak(rep);
        return;
      }
    }
  }

  // 3) chercher une définition (mots de la question dans la def)
  for(const key of Object.keys(FIELDS)){
    for(const it of FIELDS[key]){
      if(normalize(it.def).includes(q)){
        const rep = it.mot + " : " + it.def;
        bubble.textContent = rep;
        speak(rep);
        return;
      }
    }
  }

  const fallback = "Je n'ai pas encore cette connaissance dans ma base. Ajoute-la dans la section KNOWLEDGE du fichier, et je saurai répondre.";
  bubble.textContent = fallback;
  speak(fallback);
}
