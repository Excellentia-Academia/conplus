<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Josef – Quiz multijoueur</title>
<style>
  :root{--bg1:#6a11cb;--bg2:#2575fc;--card:rgba(255,255,255,.12);--txt:#fff;--brand:#2575fc;--ok:#00e676;--ko:#ff5252;--warn:#ffb300}
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(270deg,var(--bg1),var(--bg2),var(--bg1));background-size:600% 600%;animation:g 15s ease infinite;color:var(--txt);min-height:100vh;margin:0;display:grid;place-items:center;padding:12px}
  @keyframes g{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .container{background:var(--card);backdrop-filter:blur(12px);width:min(900px,96vw);border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
  h1{margin:0 0 18px;font-size:clamp(24px,3vw,34px);text-align:center}
  h2{margin:0 0 12px;font-size:1.2rem}
  button{padding:12px 18px;font-size:1rem;font-weight:700;border-radius:12px;border:none;cursor:pointer;background:#fff;color:var(--brand);transition:.2s;box-shadow:0 4px 10px rgba(0,0,0,.1)}
  button:hover:not(:disabled){background:var(--brand);color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  input[type="text"]{font-size:1.1rem;padding:12px 14px;border-radius:10px;border:none;width:100%;margin:8px 0;background:#fff;color:#222;outline:none}
  input:focus{box-shadow:0 0 8px var(--brand)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .row>*{flex:1;min-width:140px}
  .hidden{display:none !important}
  .pill{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:.9rem;margin:3px}
  .status{text-align:center;margin:10px 0;font-weight:600}
  #msg,#msg2,#msg3{min-height:26px;text-align:center;font-weight:700;margin:10px 0}
  .scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .player-card{background:rgba(0,0,0,.2);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent}
  .player-card.me{border-color:#fff}
  .player-card.winner{border-color:var(--ok);background:rgba(0,230,118,.15)}
  .player-name{font-weight:700}
  .player-score{font-size:1.3rem;font-weight:900}
  #questionBox{background:rgba(0,0,0,.18);border-radius:14px;padding:20px;margin:14px 0;text-align:center}
  #prefixBig{font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:.15em;margin-bottom:10px}
  #definitionText{font-size:clamp(16px,2.2vw,20px);line-height:1.5}
  #timerBar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:12px 0}
  #timerFill{height:100%;background:var(--ok);width:100%;transition:width .3s linear}
  .timer-danger #timerFill{background:var(--ko)}
  #timerText{text-align:center;font-weight:900;font-size:1.2rem;margin-top:4px}
  .big{font-size:clamp(28px,5vw,44px);font-weight:900;text-align:center;margin:20px 0}
  .code{font-family:monospace;font-size:2rem;letter-spacing:.3em;text-align:center;margin:10px 0;background:rgba(0,0,0,.25);padding:12px;border-radius:10px}
  .footnote{text-align:center;opacity:.8;font-size:.85rem;margin-top:16px}
</style>
</head>
<body>
<div class="container">
  <h1>🎯 Josef – Quiz multijoueur</h1>

  <div id="screenHome">
    <div class="row"><input id="pseudo" type="text" placeholder="Ton pseudo" maxlength="16" autocomplete="off" /></div>
    <div class="row">
      <button id="btnCreate">➕ Créer une partie</button>
      <input id="joinCode" type="text" placeholder="Code (4 chiffres)" maxlength="4" inputmode="numeric" style="max-width:200px" />
      <button id="btnJoin">🔗 Rejoindre</button>
    </div>
    <div id="msg"></div>
    <div class="footnote">2 à 4 joueurs · 20 questions · premier à 200 pts 🏆</div>
  </div>

  <div id="screenLobby" class="hidden">
    <h2 style="text-align:center">Salle d'attente</h2>
    <p style="text-align:center">Code de la partie :</p>
    <div class="code" id="lobbyCode">----</div>
    <p class="status" id="lobbyStatus">En attente de joueurs…</p>
    <div class="scoreboard" id="lobbyPlayers"></div>
    <div class="row" id="hostControls"><button id="btnStart" disabled>🚀 Lancer la partie</button></div>
    <div id="msg2" class="status"></div>
  </div>

  <div id="screenGame" class="hidden">
    <div class="status">
      <span class="pill" id="qCounter">Question 1/20</span>
      <span class="pill" id="gameStateLabel"></span>
    </div>
    <div class="scoreboard" id="liveScoreboard"></div>
    <div id="questionBox">
      <div id="prefixBig">–</div>
      <div id="definitionText">…</div>
    </div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="timerText">30s</div>
    <div class="row">
      <input id="answer" type="text" placeholder="Ta réponse…" autocomplete="off" />
      <button id="btnSubmit" style="max-width:140px">Valider</button>
    </div>
    <div id="msg3" class="status"></div>
  </div>

  <div id="screenEnd" class="hidden">
    <div class="big" id="endTitle">Partie terminée</div>
    <div class="scoreboard" id="finalScoreboard"></div>
    <div class="row"><button id="btnLeave">🏠 Retour à l'accueil</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

const TOTAL_QUESTIONS = 20;

const WIN_SCORE = 200;

/* ========================================================
   HELPERS
   ======================================================== */
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const setMsg = (id, text, color='#fff') => { const el=$(id); if(el){el.textContent=text;el.style.color=color;} };

const normalize = s => (s || '')
  .toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z\-' ]/g,'')
  .trim();

function pickRandomQuestions(n){
  const all = [];
  for (const prefix of Object.keys(FIELDS)) {
    for (const item of FIELDS[prefix]) {
      all.push({ prefix, mot: item.mot, def: item.def });
    }
  }
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, n);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let app, auth, db;
let uid = null;
let pseudo = '';
let roomCode = null;
let isHost = false;
let unsubscribeRoom = null;
let currentRoom = null;
let timerInterval = null;
let lastQuestionStart = 0;
let offset = 0;
let lastAnsweredQ = -1;

/* ========================================================
   INIT FIREBASE
   ======================================================== */
async function initFirebase(){
  if (!FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === 'REMPLACE_MOI'){
    alert("⚠️ Configure FIREBASE_CONFIG en haut du fichier !");
    return;
  }
  app = firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.database();

  db.ref('.info/serverTimeOffset').on('value', snap => {
    offset = snap.val() || 0;
  });

  try {
    await auth.signInAnonymously();
  } catch(e) {
    alert("Auth anonyme échouée. Active 'Anonymous' dans Firebase Authentication.\n\n" + e.message);
    return;
  }
  uid = auth.currentUser.uid;

  db.ref('.info/connected').on('value', snap => {
    if (!snap.val() || !roomCode || !uid) return;
    db.ref(`rooms/${roomCode}/players/${uid}`).onDisconnect().remove();
  });
}

function serverNow(){ return Date.now() + offset; }

/* ========================================================
   ACCUEIL
   ======================================================== */
$('btnCreate').addEventListener('click', () => {
  const p = $('pseudo').value.trim();
  if (!p) return setMsg('msg','Entre un pseudo.', '#ffb300');
  pseudo = p;
  createRoom();
});

$('btnJoin').addEventListener('click', () => {
  const p = $('pseudo').value.trim();
  const code = $('joinCode').value.trim();
  if (!p) return setMsg('msg','Entre un pseudo.', '#ffb300');
  if (!/^\d{4}$/.test(code)) return setMsg('msg','Le code doit être 4 chiffres.', '#ffb300');
  pseudo = p;
  joinRoom(code);
});

/* ========================================================
   CRÉATION / REJOINDRE
   ======================================================== */
async function createRoom(){
  let code;
  for (let i = 0; i < 10; i++){
    code = String(Math.floor(1000 + Math.random()*9000));
    const snap = await db.ref(`rooms/${code}`).get();
    if (!snap.exists()) break;
    code = null;
  }
  if (!code) return setMsg('msg','Impossible de créer la salle. Réessaie.', '#ff5252');

  const room = {
    hostId: uid,
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    state: 'lobby',
    currentQ: 0,
    qStartAt: 0,
    questions: [],
    players: {
      [uid]: { name: pseudo, score: 0, lastWrongQ: -1, joinedAt: firebase.database.ServerValue.TIMESTAMP }
    }
  };
  await db.ref(`rooms/${code}`).set(room);
  isHost = true;
  roomCode = code;
  enterLobby();
}

async function joinRoom(code){
  const snap = await db.ref(`rooms/${code}`).get();
  if (!snap.exists()) return setMsg('msg','Salle introuvable.', '#ff5252');
  const room = snap.val();
  if (room.state !== 'lobby') return setMsg('msg','La partie a déjà commencé.', '#ff5252');
  const playerCount = Object.keys(room.players || {}).length;
  if (playerCount >= MAX_PLAYERS) return setMsg('msg','Salle pleine (4 joueurs max).', '#ff5252');

  await db.ref(`rooms/${code}/players/${uid}`).set({
    name: pseudo, score: 0, lastWrongQ: -1,
    joinedAt: firebase.database.ServerValue.TIMESTAMP
  });
  isHost = false;
  roomCode = code;
  enterLobby();
}

/* ========================================================
   LOBBY
   ======================================================== */
function enterLobby(){
  hide('screenHome'); show('screenLobby');
  $('lobbyCode').textContent = roomCode;
  hide('hostControls');
  if (isHost) show('hostControls');

  unsubscribeRoom = db.ref(`rooms/${roomCode}`).on('value', snap => {
    const room = snap.val();
    if (!room) return;
    currentRoom = room;
    renderLobby(room);
    if (room.state === 'playing') {
      if ($('screenGame').classList.contains('hidden')) enterGame();
      renderGame(room);
    }
    if (room.state === 'ended' && $('screenEnd').classList.contains('hidden')) renderEnd(room);
  });
}

function renderLobby(room){
  const players = room.players || {};
  const entries = Object.entries(players).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  $('lobbyPlayers').innerHTML = entries.map(([pid, p]) => `
    <div class="player-card ${pid===uid?'me':''}">
      <span class="player-name">${escapeHtml(p.name)}${pid===room.hostId?' 👑':''}</span>
      <span class="pill">${pid===uid?'toi':'prêt'}</span>
    </div>
  `).join('');

  const hostBtn = $('btnStart');
  if (isHost){
    hostBtn.disabled = entries.length < 2;
    $('lobbyStatus').textContent = entries.length < 2
      ? "Attends au moins 1 autre joueur…"
      : `${entries.length} joueur(s) prêt(s). Lance la partie !`;
  } else {
    $('lobbyStatus').textContent = "En attente que l'hôte lance la partie…";
  }
}

$('btnStart').addEventListener('click', async () => {
  if (!isHost) return;
  const room = currentRoom;
  if (!room) return;
  const players = Object.keys(room.players || {});
  if (players.length < 2) return setMsg('msg2', 'Il faut au moins 2 joueurs.', '#ffb300');

  const questions = pickRandomQuestions(TOTAL_QUESTIONS);
  const updates = {
    state: 'playing',
    currentQ: 0,
    questions,
    qStartAt: firebase.database.ServerValue.TIMESTAMP,
    winnerId: null,
    endReason: null
  };
  players.forEach(pid => {
    updates[`players/${pid}/score`] = 0;
    updates[`players/${pid}/lastWrongQ`] = -1;
  });
  await db.ref(`rooms/${roomCode}`).update(updates);
});

/* ========================================================
   JEU
   ======================================================== */
function enterGame(){
  hide('screenLobby'); hide('screenHome'); hide('screenEnd'); show('screenGame');
  lastAnsweredQ = -1;
  $('answer').value = '';
  $('answer').disabled = false;
  $('btnSubmit').disabled = false;
  startTimerLoop();
}

$('btnSubmit').addEventListener('click', submitAnswer);
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(); });

async function submitAnswer(){
  const room = currentRoom;
  if (!room || room.state !== 'playing') return;
  const qIdx = room.currentQ;
  if (lastAnsweredQ === qIdx) return;

  const userVal = normalize($('answer').value);
  if (!userVal) return;

  const q = room.questions[qIdx];
  if (!q) return;

  const correct = userVal === normalize(q.mot);
  lastAnsweredQ = qIdx;
  $('answer').disabled = true;
  $('btnSubmit').disabled = true;

  if (correct){
    setMsg('msg3', `✅ Correct ! +${POINTS_PER_CORRECT} pts`, '#00e676');
    const myScore = (room.players[uid]?.score || 0) + POINTS_PER_CORRECT;
    const updates = {};
    updates[`rooms/${roomCode}/players/${uid}/score`] = myScore;

    if (myScore >= WIN_SCORE) {
      updates[`rooms/${roomCode}/state`] = 'ended';
      updates[`rooms/${roomCode}/winnerId`] = uid;
    } else if (qIdx + 1 >= room.questions.length) {
      updates[`rooms/${roomCode}/state`] = 'ended';
      updates[`rooms/${roomCode}/winnerId`] = null;
      updates[`rooms/${roomCode}/endReason`] = 'out_of_questions';
    } else {
      updates[`rooms/${roomCode}/currentQ`] = qIdx + 1;
      updates[`rooms/${roomCode}/qStartAt`] = firebase.database.ServerValue.TIMESTAMP;
    }
    await db.ref().update(updates);
  } else {
    setMsg('msg3', `❌ Mauvaise réponse.`, '#ff5252');
    await db.ref(`rooms/${roomCode}/players/${uid}/lastWrongQ`).set(qIdx);

    const snap = await db.ref(`rooms/${roomCode}/players`).get();
    const all = snap.val() || {};
    const allWrong = Object.keys(all).length > 0 && Object.values(all).every(p => p.lastWrongQ === qIdx);
    if (allWrong){
      await db.ref(`rooms/${roomCode}`).update({ state: 'ended', winnerId: null, endReason: 'all_wrong' });
    }
  }
}

function renderGame(room){
  const entries = Object.entries(room.players || {}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $('liveScoreboard').innerHTML = entries.map(([pid,p]) => `
    <div class="player-card ${pid===uid?'me':''} ${pid===room.winnerId?'winner':''}">
      <span class="player-name">${escapeHtml(p.name)}</span>
      <span class="player-score">${p.score||0}</span>
    </div>
  `).join('');

  const qIdx = room.currentQ;
  $('qCounter').textContent = `Question ${qIdx+1}/${room.questions.length}`;
  const q = room.questions[qIdx];
  if (q){
    $('prefixBig').textContent = q.prefix.toUpperCase();
    $('definitionText').textContent = q.def;
  }

  if (qIdx !== lastAnsweredQ){
    $('answer').disabled = false;
    $('btnSubmit').disabled = false;
  }
}

function startTimerLoop(){
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const room = currentRoom;
    if (!room || room.state !== 'playing') return;
    const elapsed = serverNow() - room.qStartAt;
    const remain = Math.max(0, QUESTION_DURATION_MS - elapsed);
    const pct = (remain / QUESTION_DURATION_MS) * 100;
    $('timerFill').style.width = pct + '%';
    $('timerText').textContent = Math.ceil(remain/1000) + 's';
    $('timerBar').classList.toggle('timer-danger', remain < 10000);

    if (remain <= 0 && isHost) handleTimeout();
  }, 250);
}

async function handleTimeout(){
  const snap = await db.ref(`rooms/${roomCode}`).get();
  const room = snap.val();
  if (!room || room.state !== 'playing') return;
  const elapsed = serverNow() - room.qStartAt;
  if (elapsed < QUESTION_DURATION_MS - 500) return;
  if (room.qStartAt_processed === room.qStartAt) return;

  const qIdx = room.currentQ;
  const updates = {};
  updates[`rooms/${roomCode}/qStartAt_processed`] = room.qStartAt;

  if (qIdx + 1 >= room.questions.length){
    updates[`rooms/${roomCode}/state`] = 'ended';
    updates[`rooms/${roomCode}/winnerId`] = null;
    updates[`rooms/${roomCode}/endReason`] = 'out_of_questions';
  } else {
    updates[`rooms/${roomCode}/currentQ`] = qIdx + 1;
    updates[`rooms/${roomCode}/qStartAt`] = firebase.database.ServerValue.TIMESTAMP;
  }
  await db.ref().update(updates);
}

/* ========================================================
   FIN
   ======================================================== */
function renderEnd(room){
  hide('screenGame'); show('screenEnd');
  if (timerInterval) clearInterval(timerInterval);
  const entries = Object.entries(room.players || {}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $('finalScoreboard').innerHTML = entries.map(([pid,p],i) => `
    <div class="player-card ${pid===room.winnerId?'winner':''}">
      <span class="player-name">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '} ${escapeHtml(p.name)}</span>
      <span class="player-score">${p.score||0}</span>
    </div>
  `).join('');

  if (room.winnerId){
    const w = room.players[room.winnerId];
    $('endTitle').textContent = `🏆 ${w.name} gagne avec ${w.score} pts !`;
  } else {
    $('endTitle').textContent = room.endReason === 'all_wrong'
      ? "❌ Tout le monde a raté — aucun gagnant"
      : "⏱ Plus de questions — aucun gagnant";
  }
}

$('btnLeave').addEventListener('click', async () => {
  if (roomCode && uid) {
    await db.ref(`rooms/${roomCode}/players/${uid}`).remove().catch(()=>{});
  }
  if (unsubscribeRoom && roomCode) {
    db.ref(`rooms/${roomCode}`).off('value', unsubscribeRoom);
  }
  location.reload();
});

/* ========================================================
   DÉMARRAGE
   ======================================================== */
initFirebase().catch(err => {
  console.error(err);
  alert("Erreur Firebase : " + err.message + "\nVérifie ta config.");
});
</script>
