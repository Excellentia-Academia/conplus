<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Coach Chill</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e2a4a, #3b2a5a, #1a3a3a);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8f0ff;
    overflow: hidden;
  }

  /* ---------- Personnage ---------- */
  .coach {
    position: relative;
    width: 180px;
    height: 220px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .head {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 110px;
    background: radial-gradient(circle at 35% 30%, #ffe0b2, #ffb74d);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255, 200, 120, 0.35);
  }

  .eye {
    position: absolute;
    top: 42px;
    width: 16px; height: 16px;
    background: #2a1a0a;
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .eye.left { left: 26px; }
  .eye.right { right: 26px; }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }

  .mouth {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: 34px; height: 8px;
    background: #8d4a2a;
    border-radius: 0 0 20px 20px;
    transition: all 0.15s;
  }
  .mouth.talking {
    height: 20px;
    width: 26px;
    border-radius: 50%;
    animation: talk 0.18s infinite alternate;
  }
  @keyframes talk {
    from { height: 8px; }
    to   { height: 22px; }
  }

  .body {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 100px;
    background: linear-gradient(180deg, #4fc3f7, #0288d1);
    border-radius: 60px 60px 20px 20px;
    box-shadow: 0 10px 30px rgba(0, 150, 220, 0.4);
  }

  /* ---------- Halos d'animation ---------- */
  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 160px; height: 160px;
    margin: -80px 0 0 -80px;
    border: 2px solid rgba(79, 195, 247, 0.5);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  .pulse-ring.active {
    animation: pulse 1.5s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.7); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* ---------- UI ---------- */
  .panel {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .bubble {
    max-width: 340px;
    min-height: 54px;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(8px);
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    transition: opacity 0.3s;
  }

  button {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    color: #0a1628;
    background: linear-gradient(135deg, #4fc3f7, #81d4fa);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(79, 195, 247, 0.55); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="coach">
    <div class="pulse-ring" id="ring"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth" id="mouth"></div>
    </div>
    <div class="body"></div>
  </div>

  <div class="panel">
    <div class="bubble" id="bubble">Salut, moi c'est Kéo, ton coach chill. Prêt à te motiver ?</div>
    <button id="btn">Parle-moi, Kéo 🎧</button>
  </div>

<script>
  const phrases = [
    "Respire un grand coup. Tu gères déjà plus que tu ne le crois.",
    "Un petit pas aujourd'hui vaut mieux qu'un grand saut jamais fait.",
    "Relâche les épaules. Souris. Maintenant, avance tranquillement.",
    "La régularité bat le talent. Sois régulier, pas parfait.",
    "Tu n'as pas besoin d'être motivé tout le temps. Juste de commencer.",
    "Ferme les yeux deux secondes. Voilà, tu es déjà plus calme.",
    "Chaque effort compte, même le plus petit. Surtout le plus petit.",
    "Sois indulgent avec toi-même. La progression n'est pas une ligne droite."
  ];

  const bubble = document.getElementById('bubble');
  const btn = document.getElementById('btn');
  const mouth = document.getElementById('mouth');
  const ring = document.getElementById('ring');

  let index = 0;

  // Sélection d'une voix française si disponible
  let chillVoice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    chillVoice =
      voices.find(v => v.lang.startsWith('fr') && /female|femme|amelie|audrey|marie/i.test(v.name)) ||
      voices.find(v => v.lang.startsWith('fr')) ||
      voices[0];
  }
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();

  function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (chillVoice) u.voice = chillVoice;
    u.lang = 'fr-FR';
    u.rate = 0.92;    // plus lent = plus chill
    u.pitch = 1.05;
    u.volume = 1;

    u.onstart = () => {
      mouth.classList.add('talking');
      ring.classList.add('active');
      btn.disabled = true;
    };
    u.onend = () => {
      mouth.classList.remove('talking');
      ring.classList.remove('active');
      btn.disabled = false;
    };
    u.onerror = () => {
      mouth.classList.remove('talking');
      ring.classList.remove('active');
      btn.disabled = false;
    };

    speechSynthesis.speak(u);
  }

  btn.addEventListener('click', () => {
    const text = phrases[index % phrases.length];
    index++;
    bubble.textContent = text;
    speak(text);
  });
</script>
</body>
</html>
