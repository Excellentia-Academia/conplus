<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya Coach — Test auto</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px;
       background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
       font-family:'Segoe UI',system-ui,sans-serif;color:#e8f0ff}
  h1{font-size:1.3rem;margin-bottom:4px;color:#4fc3f7}
  .panel{width:min(640px,96vw);display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.8rem}
  .pill{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
  .prefix{font-size:1.8rem;font-weight:900;text-align:center;color:#ce93d8;min-height:2rem}
  .bubble{min-height:60px;padding:12px 16px;background:rgba(255,255,255,.08);
          border:1px solid rgba(255,255,255,.15);border-radius:14px;font-size:.95rem;
          line-height:1.5;text-align:center}
  .msg{min-height:22px;text-align:center;font-weight:700;font-size:.9rem}
  .msg.ok{color:#00e676}.msg.ko{color:#ff5252}
  .row{display:flex;gap:8px}
  .row input{flex:1;padding:12px;border-radius:12px;border:none;font-size:1rem;
             background:rgba(255,255,255,.92);color:#111;outline:none}
  .row button{padding:12px 18px;font-weight:700;border:none;border-radius:12px;cursor:pointer;
              background:linear-gradient(135deg,#4fc3f7,#81d4fa);color:#0a1628}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .controls button{padding:10px;font-weight:700;border:none;border-radius:12px;cursor:pointer;
                   background:linear-gradient(135deg,#ce93d8,#ab47bc);color:#1a0a20}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:140px;overflow-y:auto;
        padding:8px;background:rgba(0,0,0,.15);border-radius:12px}
  .bank button{padding:6px 10px;font-size:.8rem;font-weight:800;border:1px solid rgba(255,255,255,.2);
               border-radius:8px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
  .bank button.active{background:#fff;color:#6a1b9a}
  .debug{font-size:.72rem;opacity:.6;text-align:center;min-height:1rem}
</style>
</head>
<body>

<h1>Ya Coach — Mode automatique</h1>

<div class="panel">
  <div class="stats">
    <span class="pill" id="pPos">Question 0 / 0</span>
    <span class="pill" id="pScore">Score : 0</span>
    <span class="pill" id="pState">État : arrêté</span>
  </div>

  <div class="prefix" id="prefix">– –</div>
  <div class="bubble" id="bubble">Appuie sur « Démarrer » pour lancer le jeu automatique.</div>
  <div class="msg" id="msg"></div>

  <div class="row">
    <input id="answer" placeholder="Écris le mot puis Entrée…" autocomplete="off" disabled>
    <button id="btnCheck" disabled>Vérifier</button>
  </div>

  <div class="controls">
    <button id="btnStart">▶ Démarrer</button>
    <button id="btnStop">⏹ Stop</button>
    <button id="btnRepeat">🔁 Répéter</button>
  </div>

  <div class="bank" id="bank"></div>
  <div class="debug" id="debug"></div>
</div>

<script>
/* ===== BASE (10 champs seulement pour test) ===== */
const FIELDS = {
  "Pr": [
    ["Précision","Le fait de donner des détails exacts et précis sur quelque chose."],
    ["Profond","Qui se rapporte à la profondeur ou à une intensité importante."],
    ["Profession","Domaine d'activité ou métier dans lequel une personne travaille."],
    ["Progrès","Avancement ou amélioration dans une situation ou un domaine."],
    ["Promesse","Engagement ou parole donnée de faire quelque chose."],
    ["Proverbe","Expression populaire qui contient une sagesse ou un conseil."],
    ["Précieux","Qui a une grande valeur ou importance."],
    ["Préparation","Action de se préparer en vue d'une activité."],
    ["Précaution","Mesure prise pour éviter un danger ou un problème."],
    ["Privilège","Avantage ou droit spécial accordé à certaines personnes."]
  ],
  "Se": [
    ["Sensation","Perception ou ressenti d'un stimulus par les sens."],
    ["Séduction","Charme ou pouvoir d'attraction envers quelqu'un."],
    ["Sérénité","État de calme et de tranquillité."],
    ["Secret","Quelque chose qui est caché ou inconnu du public."],
    ["Séparation","Acte de se séparer ou de se diviser."],
    ["Sérieux","État de responsabilité et de gravité."],
    ["Sentiment","Émotion ou affection ressentie envers quelqu'un ou quelque chose."],
    ["Service","Action d'aider ou d'assister quelqu'un."],
    ["Seconde","Unité de temps ou rang après la première."],
    ["Septième","Position dans une série après le sixième."]
  ],
  "Tr": [
    ["Transformation","Changement ou métamorphose d'une chose en une autre."],
    ["Tristesse","État de chagrin ou de mélancolie."],
    ["Travail","Emploi ou activité professionnelle."],
    ["Traitement","Action de soigner ou de procéder à une procédure médicale."],
    ["Tradition","Coutume transmise de génération en génération."],
    ["Tragédie","Drame qui provoque de la tristesse ou du désespoir."],
    ["Trentième","Position dans une série après le vingt-neuvième."],
    ["Triomphe","Victoire éclatante à l'issue d'une lutte."],
    ["Transparence","Clarté d'une substance ou d'une situation."],
    ["Trésor","Richesse ou bien précieux à valeur sentimentale ou matérielle."]
  ],
  "Ch": [
    ["Chaleur","Sensation de température élevée."],
    ["Chambre","Pièce où l'on dort."],
    ["Chanson","Composition musicale avec paroles."],
    ["Chapeau","Coiffure protégeant du soleil ou de la pluie."],
    ["Charité","Aide apportée aux personnes dans le besoin."],
    ["Chat","Animal domestique qui miaule."],
    ["Château","Bâtiment fortifié, résidence noble."],
    ["Chauffage","Système pour chauffer une pièce."],
    ["Chaussure","Accessoire qui recouvre le pied."],
    ["Chiffre","Symbole numérique."],
    ["Chocolat","Produit alimentaire à base de cacao."],
    ["Choix","Action de choisir."],
    ["Chute","Action de tomber."]
  ],
  "Co": [
    ["Concombre","Légume vert allongé."],
    ["Connaissance","Savoir acquis."],
    ["Coopération","Action de travailler ensemble."],
    ["Coquillage","Mollusque à coquille; objet décoratif."],
    ["Coriandre","Plante aromatique condimentaire."],
    ["Corps","Partie physique d'un être vivant."],
    ["Cordonnier","Artisan qui répare des chaussures."],
    ["Coûteux","Qui coûte cher."],
    ["Couverture","Pièce pour couvrir; ou page d'un livre."],
    ["Couteau","Outil tranchant pour couper."],
    ["Couleur","Perception visuelle."],
    ["Conflit","Opposition entre parties."]
  ],
  "De": [
    ["Définition","Explication précise d'un mot ou concept."],
    ["Démocratie","Système où le peuple exerce le pouvoir."],
    ["Dérision","Moquerie ouverte."],
    ["Désespoir","Tristesse profonde et perte d'espoir."],
    ["Détective","Enquêteur résolvant des mystères."],
    ["Décision","Choix pris après réflexion."],
    ["Désir","Envie d'obtenir quelque chose."],
    ["Début","Commencement d'une période ou action."],
    ["Découvrir","Trouver ou faire connaître du nouveau."],
    ["Défaut","Manque ou imperfection."],
    ["Détail","Élément composant un ensemble."],
    ["Détente","Moment de repos et de relaxation."],
    ["Défi","Provocation à une épreuve."]
  ],
  "Ma": [
    ["Magie","Utilisation de pouvoirs surnaturels."],
    ["Maison","Bâtiment où l'on vit."],
    ["Mariage","Union légale de partenaires de vie."],
    ["Maladie","Altération de la santé."],
    ["Matin","Première partie de la journée."],
    ["Masque","Objet porté sur le visage."],
    ["Matière","Substance composant les objets."],
    ["Marché","Lieu d'achat et de vente."],
    ["Magasin","Endroit où l'on vend des produits."],
    ["Main","Partie du corps pour saisir."],
    ["Machine","Appareil réalisant une tâche."]
  ],
  "In": [
    ["Insecte","Petit animal à six pattes, souvent ailé."],
    ["Inconnu","Qui n'est pas reconnu ou identifié."],
    ["Innovant","Qui apporte des idées ou méthodes nouvelles."],
    ["Innovation","Introduction de nouvelles idées ou produits."],
    ["Injustice","Absence d'équité."],
    ["Information","Faits ou connaissances sur un sujet."],
    ["Inspection","Action d'examiner attentivement."],
    ["Intégrité","Respect de principes moraux."],
    ["Inviter","Demander à quelqu'un de venir."],
    ["Invention","Création d'une chose nouvelle."]
  ],
  "Re": [
    ["Rêve","Suite d'images et sensations pendant le sommeil."],
    ["Réalité","Ensemble des choses existantes."],
    ["Rendre","Donner en retour ce qui a été reçu."],
    ["Rendement","Production rapportée aux moyens engagés."],
    ["Réfléchir","Penser avec attention."],
    ["Région","Territoire délimité géographiquement ou administrativement."],
    ["Recherche","Action de chercher des informations ou solutions."],
    ["Résultat","Conséquence d'une action."],
    ["Réaliser","Accomplir; mener à bien."],
    ["Résoudre","Trouver une solution à un problème."],
    ["Réussir","Atteindre son objectif avec succès."]
  ],
  "Ac": [
    ["Accompagnement","Soutien ou aide fournie à quelqu'un."],
    ["Accès","Possibilité d'entrer dans un lieu ou d'obtenir quelque chose."],
    ["Action","Acte de faire quelque chose."],
    ["Activité","Occupation ou exercice d'une action."],
    ["Achat","Acquisition d'un bien."],
    ["Accident","Événement imprévu, souvent tragique."],
    ["Accord","Entente ou consensus entre plusieurs personnes."],
    ["Acquisition","Obtention d'une chose."],
    ["Acteur","Personne qui joue un rôle au théâtre ou au cinéma."],
    ["Acclamation","Applaudissements ou éloges enthousiastes."]
  ]
};

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const prefixEl = $('prefix'), bubble = $('bubble'), msgEl = $('msg');
const answerEl = $('answer'), btnCheck = $('btnCheck');
const pPos = $('pPos'), pScore = $('pScore'), pState = $('pState');
const debugEl = $('debug');

/* ===== VOIX ===== */
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  voice = v.find(x=>x.lang.startsWith('fr')) || v[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

let speaking = false;
function speak(text, cb){
  if(!('speechSynthesis' in window)){ if(cb)cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang='fr-FR'; u.rate=0.95; u.pitch=0.95;
  speaking = true;
  u.onend = ()=>{ speaking=false; if(cb)cb(); };
  u.onerror = ()=>{ speaking=false; if(cb)cb(); };
  speechSynthesis.speak(u);
}

/* ===== ÉTAT ===== */
const S = {
  prefix: null,
  order: [],
  pos: 0,
  score: 0,
  running: false,
  waiting: false
};

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[^a-z0-9'\- ]/g,' ').replace(/\s+/g,' ').trim();
}
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function log(t){ debugEl.textContent = t; }

function updateUI(){
  const total = S.prefix ? FIELDS[S.prefix].length : 0;
  pPos.textContent = `Question ${total ? S.pos+1 : 0} / ${total}`;
  pScore.textContent = `Score : ${S.score}`;
  pState.textContent = `État : ${S.running ? 'en cours' : 'arrêté'}`;
}

/* ===== DÉMARRAGE ===== */
function startWithPrefix(prefix){
  if(!FIELDS[prefix]) return;
  S.prefix = prefix;
  S.order = shuffle([...Array(FIELDS[prefix].length).keys()]);
  S.pos = 0;
  S.running = true;
  S.waiting = false;
  highlightBank(prefix);
  updateUI();
  askQuestion();          // ← pose la 1re question automatiquement
}

/* ===== POSER UNE QUESTION (100% auto) ===== */
function askQuestion(){
  if(!S.running || !S.prefix) return;
  if(S.pos >= S.order.length){
    finishChamp();
    return;
  }
  const [mot, def] = FIELDS[S.prefix][S.order[S.pos]];
  prefixEl.textContent = S.prefix;
  bubble.textContent = def;
  msgEl.textContent = '';
  msgEl.className = 'msg';
  answerEl.value = '';
  answerEl.disabled = false;
  btnCheck.disabled = false;
  answerEl.focus();
  updateUI();
  log('Question posée : ' + mot);

  // Lit la définition, puis active la saisie
  speak(`Champ ${S.prefix}. ${def}`, ()=>{
    S.waiting = true;      // prêt à recevoir la réponse
    log('En attente de la réponse…');
  });
}

/* ===== VÉRIFICATION ===== */
function checkAnswer(){
  if(!S.running || !S.waiting) return;
  const [mot] = FIELDS[S.prefix][S.order[S.pos]];
  const user = normalize(answerEl.value);
  const target = normalize(mot);
  S.waiting = false;
  answerEl.disabled = true;
  btnCheck.disabled = true;

  if(user && user === target){
    S.score++;
    msgEl.textContent = `✅ Correct : ${mot}`;
    msgEl.className = 'msg ok';
    updateUI();
    speak(`Correct. ${mot}`, ()=>{
      // Enchaînement AUTOMATIQUE
      S.pos++;
      setTimeout(askQuestion, 500);
    });
  } else {
    msgEl.textContent = `❌ La bonne réponse était : ${mot}`;
    msgEl.className = 'msg ko';
    speak(`Incorrect. La bonne réponse était : ${mot}. Je mélange les questions.`, ()=>{
      // Mélange des questions restantes + relance auto
      const rest = S.order.slice(S.pos+1);
      S.order = [...S.order.slice(0, S.pos+1), ...shuffle(rest)];
      S.pos++;
      setTimeout(askQuestion, 500);
    });
  }
}

/* ===== FIN DE CHAMP ===== */
function finishChamp(){
  msgEl.textContent = `🎉 Champ « ${S.prefix} » terminé ! Score : ${S.score}`;
  msgEl.className = 'msg ok';
  bubble.textContent = 'Choisis un autre champ ci-dessous, ou clique Démarrer.';
  prefixEl.textContent = '– –';
  answerEl.disabled = true;
  btnCheck.disabled = true;
  S.running = false;
  updateUI();
  speak(`Bravo, champ ${S.prefix} terminé. Score ${S.score}.`);
}

/* ===== BANQUE ===== */
const bankEl = $('bank');
function buildBank(){
  bankEl.innerHTML = '';
  Object.keys(FIELDS).sort((a,b)=>a.localeCompare(b,'fr')).forEach(k=>{
    const b = document.createElement('button');
    b.textContent = k.toUpperCase();
    b.onclick = ()=> startWithPrefix(k);
    bankEl.appendChild(b);
  });
}
function highlightBank(k){
  [...bankEl.children].forEach(b=> b.classList.toggle('active', b.textContent === k.toUpperCase()));
}

/* ===== BOUTONS ===== */
$('btnStart').onclick = ()=>{
  if(speechSynthesis.speaking) speechSynthesis.cancel();
  const first = Object.keys(FIELDS).sort((a,b)=>a.localeCompare(b,'fr'))[0];
  startWithPrefix(first);
};
$('btnStop').onclick = ()=>{
  S.running = false;
  S.waiting = false;
  speechSynthesis.cancel();
  msgEl.textContent = 'Jeu arrêté.';
  msgEl.className = 'msg';
  answerEl.disabled = true;
  btnCheck.disabled = true;
  updateUI();
};
$('btnRepeat').onclick = ()=>{
  if(!S.running || !S.prefix) return;
  const [mot, def] = FIELDS[S.prefix][S.order[S.pos]];
  speak(`Champ ${S.prefix}. ${def}`, ()=>{ S.waiting = true; });
};
btnCheck.onclick = checkAnswer;
answerEl.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); });

/* ===== INIT ===== */
window.addEventListener('load', ()=>{
  buildBank();
  updateUI();
  log('Prêt. Clique sur Démarrer.');
});
</script>
</body>
</html>
