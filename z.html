<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya Coach — Maître du Jeu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:20px 14px 40px;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    font-family:'Segoe UI',system-ui,sans-serif;color:#e8f0ff;
  }
  h1{font-size:1.5rem;text-align:center;background:linear-gradient(90deg,#4fc3f7,#ce93d8);
     -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
  .sub{font-size:.85rem;opacity:.7;margin-bottom:14px;text-align:center}

  .coach{position:relative;width:140px;height:165px;animation:float 3s ease-in-out infinite;margin-bottom:8px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:85px;height:85px;
        background:radial-gradient(circle at 35% 30%,#ffe0b2,#ffb74d);border-radius:50%;
        box-shadow:0 0 36px rgba(255,200,120,.35)}
  .eye{position:absolute;top:32px;width:12px;height:12px;background:#2a1a0a;border-radius:50%;animation:blink 4s infinite}
  .eye.l{left:21px}.eye.r{right:21px}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .mouth{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:26px;height:6px;
         background:#8d4a2a;border-radius:0 0 20px 20px;transition:all .15s}
  .mouth.talk{height:17px;width:20px;border-radius:50%;animation:talk .18s infinite alternate}
  @keyframes talk{from{height:6px}to{height:19px}}
  .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:105px;height:80px;
        background:linear-gradient(180deg,#b39ddb,#6a1b9a);border-radius:52px 52px 16px 16px;
        box-shadow:0 10px 28px rgba(106,27,154,.5)}
  .hat{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:0;height:0;
       border-left:45px solid transparent;border-right:45px solid transparent;border-bottom:32px solid #4a148c;
       filter:drop-shadow(0 0 8px rgba(179,157,219,.6))}
  .ring{position:absolute;top:50%;left:50%;width:130px;height:130px;margin:-65px 0 0 -65px;
        border:2px solid rgba(179,157,219,.5);border-radius:50%;opacity:0;pointer-events:none}
  .ring.on{animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.6);opacity:0}}

  .panel{width:min(740px,96vw);display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.82rem}
  .pill{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
  .prefix{font-size:2rem;font-weight:900;letter-spacing:.2em;text-align:center;color:#ce93d8;
          text-shadow:0 0 14px rgba(206,147,216,.6);min-height:2.3rem}
  .bubble{min-height:64px;padding:12px 16px;background:rgba(255,255,255,.08);
          border:1px solid rgba(255,255,255,.15);border-radius:14px;backdrop-filter:blur(8px);
          font-size:.97rem;line-height:1.5;text-align:center}
  .msg{min-height:24px;text-align:center;font-weight:700;font-size:.95rem;transition:color .2s}
  .msg.ok{color:#00e676}
  .msg.ko{color:#ff5252}

  .answer-row{display:flex;gap:8px}
  .answer-row input{flex:1;padding:12px 14px;border-radius:12px;border:none;font-size:1rem;
                    background:rgba(255,255,255,.92);color:#111;outline:none}
  .answer-row input:focus{box-shadow:0 0 0 2px #ce93d8}
  .answer-row button{padding:12px 18px;font-weight:700;border:none;border-radius:12px;cursor:pointer;
                     background:linear-gradient(135deg,#4fc3f7,#81d4fa);color:#0a1628}

  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{font-family:inherit;transition:transform .15s}
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .controls button{padding:11px;font-size:.92rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;
                   background:linear-gradient(135deg,#ce93d8,#ab47bc);color:#1a0a20}
  .controls button.primary{background:linear-gradient(135deg,#4fc3f7,#81d4fa);color:#0a1628}

  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:180px;overflow-y:auto;
        padding:8px;background:rgba(0,0,0,.15);border-radius:12px}
  .bank button{padding:6px 10px;font-size:.82rem;font-weight:800;border:1px solid rgba(255,255,255,.2);
               border-radius:9px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
  .bank button.active{background:#fff;color:#6a1b9a}

  .foot{font-size:.78rem;opacity:.6;text-align:center;margin-top:6px}
</style>
</head>
<body>

  <h1>Ya Coach — Maître du Jeu</h1>
  <div class="sub">Réponds juste → question suivante · Erreur → il donne la réponse et mélange</div>

  <div class="coach">
    <div class="ring" id="ring"></div>
    <div class="head">
      <div class="hat"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="mouth" id="mouth"></div>
    </div>
    <div class="body"></div>
  </div>

  <div class="panel">
    <div class="stats">
      <span class="pill" id="progressPill">0 / 0</span>
      <span class="pill" id="scorePill">Score : 0</span>
      <span class="pill" id="streakPill">Série : 0</span>
      <span class="pill" id="speedPill">Vitesse ×1.00</span>
    </div>

    <div class="prefix" id="prefix">– –</div>
    <div class="bubble" id="bubble">Choisis un champ lexical ci-dessous, ou appuie sur « Démarrer ».</div>
    <div class="msg" id="msg"></div>

    <div class="answer-row">
      <input id="answer" placeholder="Écris le mot…" autocomplete="off" disabled>
      <button id="btnCheck" disabled>Vérifier</button>
    </div>

    <div class="controls">
      <button class="primary" id="btnStart">▶ Démarrer</button>
      <button id="btnRepeat">🔁 Répéter</button>
      <button id="btnSlow">🐢</button>
      <button id="btnFast">🐇</button>
    </div>

    <div class="bank" id="bank"></div>
    <div class="foot">Astuce : une erreur mélange les questions du champ pour t'aider à t'en sortir.</div>
  </div>

const $ = id => document.getElementById(id);
const mouth = $('mouth'), ring = $('ring');
const prefixEl = $('prefix'), bubble = $('bubble'), msgEl = $('msg');
const answerEl = $('answer'), btnCheck = $('btnCheck');
const progressPill = $('progressPill'), scorePill = $('scorePill');
const streakPill = $('streakPill'), speedPill = $('speedPill');

let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  voice = v.find(x=>x.lang.startsWith('fr') && /thomas|paul|male|homme/i.test(x.name))
       || v.find(x=>x.lang.startsWith('fr')) || v[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

let rate = 1;
function speak(text, cb){
  if(!('speechSynthesis' in window)){ if(cb)cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang='fr-FR'; u.rate=rate; u.pitch=0.95; u.volume=1;
  u.onstart=()=>{mouth.classList.add('talk');ring.classList.add('on');};
  u.onend=()=>{mouth.classList.remove('talk');ring.classList.remove('on'); if(cb)cb();};
  u.onerror=()=>{mouth.classList.remove('talk');ring.classList.remove('on'); if(cb)cb();};
  speechSynthesis.speak(u);
}

const state = {
  prefix: null,
  order: [],      // indices des questions du champ courant (mélangés si erreur)
  pos: 0,
  score: 0,
  streak: 0,
  running: false
};

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[^a-z0-9'\- ]/g,' ').replace(/\s+/g,' ').trim();
}
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [r[i],r[j]]=[r[j],r[i]];
  }
  return r;
}

function updatePills(){
  const total = state.prefix ? FIELDS[state.prefix].length : 0;
  progressPill.textContent = total ? `${state.pos+1} / ${total}` : `0 / 0`;
  scorePill.textContent = `Score : ${state.score}`;
  streakPill.textContent = `Série : ${state.streak}`;
  speedPill.textContent = `Vitesse ×${rate.toFixed(2)}`;
}

function currentItem(){
  if(!state.prefix) return null;
  const list = FIELDS[state.prefix];
  return list[state.order[state.pos]];
}

function renderCard(){
  if(!state.prefix){
    prefixEl.textContent = '– –';
    bubble.textContent = 'Choisis un champ lexical ci-dessous, ou appuie sur « Démarrer ».';
    answerEl.disabled = true; btnCheck.disabled = true;
    updatePills();
    return;
  }
  const list = FIELDS[state.prefix];
  const idx = state.order[state.pos];
  const [mot, def] = list[idx];

  prefixEl.textContent = state.prefix;
  bubble.textContent = def;
  msgEl.textContent = '';
  msgEl.className = 'msg';
  answerEl.value = '';
  answerEl.disabled = false;
  btnCheck.disabled = false;
  answerEl.placeholder = `Un mot qui commence par « ${state.prefix} »…`;
  updatePills();
  answerEl.focus();
}

function announceCurrent(){
  if(!state.prefix) return;
  const list = FIELDS[state.prefix];
  const idx = state.order[state.pos];
  const [mot, def] = list[idx];
  speak(`Champ ${state.prefix}. ${def}`);
}

function startWithPrefix(prefix){
  if(!FIELDS[prefix]) return;
  state.prefix = prefix;
  state.order = shuffle([...Array(FIELDS[prefix].length).keys()]);
  state.pos = 0;
  state.running = true;
  highlightBank(prefix);
  renderCard();
  announceCurrent();
}

function nextQuestion(){
  if(!state.prefix) return;
  state.pos++;
  if(state.pos >= state.order.length){
    // Fin du champ : bravo et on propose un autre
    msgEl.textContent = `🎉 Bravo ! Tu as terminé le champ « ${state.prefix} ». Choisis un autre champ ci-dessous.`;
    msgEl.className = 'msg ok';
    speak(`Bravo ! Tu as terminé le champ lexical ${state.prefix}. Choisis un autre champ.`);
    state.pos = state.order.length - 1;
    answerEl.disabled = true; btnCheck.disabled = true;
    updatePills();
    return;
  }
  renderCard();
  announceCurrent();
}

function checkAnswer(){
  if(!state.prefix) return;
  const list = FIELDS[state.prefix];
  const idx = state.order[state.pos];
  const [mot, def] = list[idx];

  const user = normalize(answerEl.value);
  const target = normalize(mot);

  if(user && user === target){
    state.score += 1;
    state.streak += 1;
    msgEl.textContent = `✅ Correct ! ${mot}`;
    msgEl.className = 'msg ok';
    speak(`Correct ! ${mot}`, ()=> setTimeout(nextQuestion, 300));
  } else {
    state.streak = 0;
    msgEl.textContent = `❌ Incorrect. La bonne réponse était : ${mot}`;
    msgEl.className = 'msg ko';
    speak(`Incorrect. La bonne réponse était : ${mot}. Je mélange les questions pour t'aider à t'en sortir.`, ()=>{
      // "Bouleverse les questions" : on mélange les questions restantes
      const remaining = state.order.slice(state.pos+1);
      const mixed = shuffle(remaining);
      state.order = [...state.order.slice(0, state.pos+1), ...mixed];
      setTimeout(nextQuestion, 400);
    });
  }
  updatePills();
}

/* Banque de champs */
const bankEl = $('bank');
function buildBank(){
  const keys = Object.keys(FIELDS).sort((a,b)=>a.localeCompare(b,'fr'));
  bankEl.innerHTML = '';
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.textContent = k.toUpperCase();
    b.addEventListener('click', ()=> startWithPrefix(k));
    bankEl.appendChild(b);
  });
}
function highlightBank(k){
  [...bankEl.children].forEach(b=> b.classList.toggle('active', b.textContent === k.toUpperCase()));
}

/* Événements */
$('btnStart').addEventListener('click', ()=>{
  if(!state.prefix){
    const first = Object.keys(FIELDS).sort((a,b)=>a.localeCompare(b,'fr'))[0];
    startWithPrefix(first);
  } else {
    announceCurrent();
  }
});
$('btnRepeat').addEventListener('click', announceCurrent);
$('btnSlow').addEventListener('click', ()=>{ rate = Math.max(0.5, rate-0.2); updatePills(); announceCurrent(); });
$('btnFast').addEventListener('click', ()=>{ rate = Math.min(2, rate+0.2); updatePills(); announceCurrent(); });
btnCheck.addEventListener('click', checkAnswer);
answerEl.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); });

window.addEventListener('load', ()=>{
  buildBank();
  renderCard();
  if(!('speechSynthesis' in window)){
    msgEl.textContent = "ℹ️ La synthèse vocale n'est pas disponible sur ce navigateur.";
  }
});
</script>
</body>
</html>
