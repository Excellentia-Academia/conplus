<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registre des Coachs - Dictée et Épellation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --carte: #f9f9f9;
      --bleu: rgb(88, 88, 238);
      --bleu-hover: rgb(72, 72, 245);
      --rouge: red;
      --gris: #e0e0e0;
    }
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #ffffff;
      --carte: #1e1e1e;
      --gris: #333333;
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      padding-bottom: 50px;
    }
    
    .toggle-btn {
      position: fixed;
      top: 10px;
      right: 20px;
      background: none;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.3s, color 0.3s, border 0.3s;
      z-index: 100;
      font-family: inherit;
    }
    .toggle-btn:hover {
      background: var(--text-color);
      color: var(--bg-color);
    }

    .back-btn {
      position: fixed;
      top: 10px;
      left: 20px;
      padding: 10px;
      border: none;
      border-radius: 500px;
      background-color: var(--gris);
      color: var(--text-color);
      cursor: pointer;
      z-index: 100;
      font-family: inherit;
      text-decoration: none;
    }
    .back-btn:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
    }

    h1 {
      background-color: var(--bleu);
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
      border-radius: 10px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .conteneur {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* Design exact de tes paragraphes */
    .categorie-titre {
      color: var(--rouge);
      font-weight: 600;
      font-size: 1.2rem;
      margin-top: 25px;
      margin-bottom: 10px;
    }

    .personne-item {
      font-size: 1.1rem;
      line-height: 1.8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .personne-item:hover {
      background: var(--carte);
    }

    .actions-personne {
      display: flex;
      gap: 8px;
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    .personne-item:hover .actions-personne {
      opacity: 1;
    }
    .actions-personne button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 5px;
    }
    .actions-personne button:hover {
      transform: scale(1.2);
    }

    /* Boutons Ajouter */
    .btn-ajouter {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 30px auto;
      padding: 15px;
      background: var(--bleu);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .btn-ajouter:hover {
      background: var(--bleu-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(88,88,238,0.4);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: var(--bg-color);
      color: var(--text-color);
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal h3 {
      text-align: center;
      color: var(--bleu);
      margin-top: 0;
      margin-bottom: 20px;
    }
    .modal label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 15px;
    }
    .modal input, .modal select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--gris);
      border-radius: 8px;
      background: var(--carte);
      color: var(--text-color);
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-annuler {
      background: var(--gris);
      color: var(--text-color);
    }
    .btn-valider {
      background: var(--bleu);
      color: white;
    }

    .msg {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 10px;
      font-weight: 600;
    }
    .msg-error { color: var(--rouge); }
    .msg-ok { color: #10b981; }
  </style>
</head>
<body>

  <a href="Test.html" class="back-btn">← Retour</a>
  <button class="toggle-btn" onclick="document.body.classList.toggle('dark-mode')">🌓 Mode</button>

  <h1 id="titreAnnee">Année 2025</h1>

  <div class="conteneur" id="contenu">
    <p style="text-align:center; opacity:0.5;">Chargement...</p>
  </div>

  <button class="btn-ajouter" onclick="ouvrirFormulaire()">➕ Ajouter une personne à l'année</button>

  <!-- MODAL (Fenêtre d'ajout / modification) -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitre">Ajouter une personne</h3>
      
      <label>Année :</label>
      <select id="selectAnnee">
        <option value="2024">2024</option>
        <option value="2025" selected>2025</option>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
        <option value="2029">2029</option>
        <option value="2030">2030</option>
      </select>

      <label>Catégorie :</label>
      <select id="selectCategorie">
        <option value="Coach">Coach</option>
        <option value="Vice-coachs">Vice-coachs</option>
        <option value="Mentors des KA">Mentors des KA</option>
        <option value="Joueuses(A)">Joueuses(A)</option>
        <option value="Autre">Autre / Invité</option>
      </select>

      <label>Nom complet :</label>
      <input type="text" id="inputNom" placeholder="Ex: Ya Lwanga Credo Musao">

      <label>Mention (ex: 🥇) :</label>
      <input type="text" id="inputMention" placeholder="Optionnel">

      <div class="modal-buttons">
        <button class="btn-annuler" onclick="fermerFormulaire()">Annuler</button>
        <button class="btn-valider" onclick="validerFormulaire()">Enregistrer</button>
      </div>
      <p id="modalMsg" class="msg"></p>
    </div>
  </div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   CONFIG FIREBASE
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA8OQxm5BcHOB2dyWCayavNYpGSut4l7W4",
  authDomain: "eeee-1387d.firebaseapp.com",
  projectId: "eeee-1387d",
  storageBucket: "eeee-1387d.firebasestorage.app",
  messagingSenderId: "777961527724",
  appId: "1:777961527724:web:5c222e42be24af0ab38209"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
const urlParams = new URLSearchParams(window.location.search);
const ANNEE_PAR_DEFAUT = urlParams.get('annee') || '2025';
document.getElementById('titreAnnee').textContent = 'Année ' + ANNEE_PAR_DEFAUT;

// Données temporaires en mémoire pour modification
let donneesActuelles = { categories: {} };
let modeEdition = false; // false = ajout, true = modification
let personneEnEdition = null; // { annee, categorie, index }

/* ============================================================
   CHARGEMENT DES DONNÉES
   ============================================================ */
async function chargerDonnees() {
  try {
    const docRef = db.collection('registres_annees').doc(ANNEE_PAR_DEFAUT);
    const snap = await docRef.get();
    
    if (snap.exists) {
      donneesActuelles = snap.data();
    } else {
      // Si l'année n'existe pas encore, on initialise avec 2025 par défaut pour te faire plaisir
      if (ANNEE_PAR_DEFAUT === '2025') {
        donneesActuelles = {
          categories: {
            "Coach": [ { nom: "Ya Lwanga Credo Musao", mention: "🥇" } ],
            "Vice-coachs": [
              { nom: "Ya Kaggwa Léon Mujanayi", mention: "🥇" },
              { nom: "Ya Lwanga Amerack Mavinga", mention: "🥇" }
            ],
            "Mentors des KA": [
              { nom: "Ya Mulumba Daniel M’komboni", mention: "" },
              { nom: "Ya Jonathan Mwanza", mention: "" },
              { nom: "Ya Kasima Noëllie Shutsha", mention: "" },
              { nom: "Ya stagiaire Emerance Deko", mention: "" },
              { nom: "Ya Kaggwa Élie Totokani", mention: "" }
            ],
            "Joueuses(A)": [
              { nom: "Anuarite. William Ngolo", mention: "🥇" },
              { nom: "Anuarite. Aubaine Singa", mention: "🥇" },
              { nom: "Anuarite. Véronique Nabintu", mention: "🥇" },
              { nom: "Anuarite. Julia Ntali", mention: "🥇" }
            ]
          }
        };
        await docRef.set(donneesActuelles);
      } else {
        donneesActuelles = { categories: {} };
      }
    }
    
    renderAffichage();
  } catch(e) {
    console.error(e);
    document.getElementById('contenu').innerHTML = `<p class="msg msg-error">Erreur de chargement : ${e.message}</p>`;
  }
}

/* ============================================================
   AFFICHAGE (Même format que ton code d'origine)
   ============================================================ */
function renderAffichage() {
  const conteneur = document.getElementById('contenu');
  const cats = donneesActuelles.categories || {};
  
  let html = '';
  let totalPersonnes = 0;

  for (const [catNom, personnes] of Object.entries(cats)) {
    if (personnes.length === 0) continue;
    totalPersonnes += personnes.length;
    
    html += `<div class="categorie-titre">${catNom}</div>`;
    
    personnes.forEach((p, index) => {
      html += `
        <div class="personne-item">
          <span>${index + 1}. ${escapeHtml(p.nom)} ${p.mention ? escapeHtml(p.mention) : ''}</span>
          <div class="actions-personne">
            <button title="Modifier" onclick="ouvrirModification('${catNom}', ${index})">✏️</button>
            <button title="Supprimer" onclick="supprimerPersonne('${catNom}', ${index})">🗑️</button>
          </div>
        </div>
      `;
    });
  }

  if (totalPersonnes === 0) {
    conteneur.innerHTML = '<p style="text-align:center; opacity:0.5;">Aucune personne enregistrée pour cette année.</p>';
  } else {
    conteneur.innerHTML = html;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   FORMULAIRE (Ajout / Modification)
   ============================================================ */
function ouvrirFormulaire() {
  modeEdition = false;
  document.getElementById('modalTitre').textContent = "Ajouter une personne";
  document.getElementById('selectAnnee').value = ANNEE_PAR_DEFAUT;
  document.getElementById('selectCategorie').value = "Coach";
  document.getElementById('inputNom').value = "";
  document.getElementById('inputMention').value = "";
  document.getElementById('modalMsg').textContent = "";
  document.getElementById('modal').classList.add('active');
}

function ouvrirModification(categorie, index) {
  modeEdition = true;
  const p = donneesActuelles.categories[categorie][index];
  personneEnEdition = { categorie, index };

  document.getElementById('modalTitre').textContent = "Modifier la personne";
  document.getElementById('selectAnnee').value = ANNEE_PAR_DEFAUT;
  document.getElementById('selectCategorie').value = categorie;
  document.getElementById('inputNom').value = p.nom;
  document.getElementById('inputMention').value = p.mention || "";
  document.getElementById('modalMsg').textContent = "";
  document.getElementById('modal').classList.add('active');
}

function fermerFormulaire() {
  document.getElementById('modal').classList.remove('active');
}

async function validerFormulaire() {
  const anneeSelectionnee = document.getElementById('selectAnnee').value;
  const categorie = document.getElementById('selectCategorie').value;
  const nom = document.getElementById('inputNom').value.trim();
  const mention = document.getElementById('inputMention').value.trim();
  const msg = document.getElementById('modalMsg');

  if (!nom) {
    msg.textContent = "❌ Le nom est obligatoire.";
    msg.className = "msg msg-error";
    return;
  }

  try {
    msg.textContent = "⏳ Sauvegarde...";
    msg.className = "msg";
    msg.style.color = "var(--bleu)";

    // Si on change d'année, ou si on ajoute une nouvelle personne
    if (anneeSelectionnee !== ANNEE_PAR_DEFAUT) {
      // Sauvegarder dans une autre année
      const docRefAutre = db.collection('registres_annees').doc(anneeSelectionnee);
      const snapAutre = await docRefAutre.get();
      let dataAutre = snapAutre.exists ? snapAutre.data() : { categories: {} };
      if (!dataAutre.categories) dataAutre.categories = {};
      if (!dataAutre.categories[categorie]) dataAutre.categories[categorie] = [];
      
      dataAutre.categories[categorie].push({ nom, mention });
      await docRefAutre.set(dataAutre);
      
      msg.textContent = `✅ Ajouté à l'année ${anneeSelectionnee} !`;
      msg.className = "msg msg-ok";
      
      // Redirection facultative pour voir la nouvelle année
      setTimeout(() => {
        window.location.href = `?annee=${anneeSelectionnee}`;
      }, 1000);
      
      return; 
    }

    // Sinon, on sauvegarde dans l'année actuelle
    if (modeEdition) {
      // Modification
      donneesActuelles.categories[personneEnEdition.categorie].splice(personneEnEdition.index, 1);
      if (!donneesActuelles.categories[categorie]) donneesActuelles.categories[categorie] = [];
      donneesActuelles.categories[categorie].push({ nom, mention });
      msg.textContent = "✅ Modifié avec succès !";
    } else {
      // Ajout
      if (!donneesActuelles.categories[categorie]) donneesActuelles.categories[categorie] = [];
      donneesActuelles.categories[categorie].push({ nom, mention });
      msg.textContent = "✅ Ajouté avec succès !";
    }

    // Sauvegarde dans Firebase
    await db.collection('registres_annees').doc(ANNEE_PAR_DEFAUT).set(donneesActuelles);

    msg.className = "msg msg-ok";
    renderAffichage();

    setTimeout(() => {
      fermerFormulaire();
    }, 1000);

  } catch(e) {
    console.error(e);
    msg.textContent = "❌ Erreur : " + e.message;
    msg.className = "msg msg-error";
  }
}

/* ============================================================
   SUPPRESSION
   ============================================================ */
async function supprimerPersonne(categorie, index) {
  if (!confirm("Voulez-vous vraiment supprimer cette personne ?")) return;

  try {
    donneesActuelles.categories[categorie].splice(index, 1);
    await db.collection('registres_annees').doc(ANNEE_PAR_DEFAUT).set(donneesActuelles);
    renderAffichage();
  } catch(e) {
    alert("Erreur lors de la suppression : " + e.message);
  }
}

/* ============================================================
   INITIALISATION
   ============================================================ */
chargerDonnees();
</script>
</body>
</html>
