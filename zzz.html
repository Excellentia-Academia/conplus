<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | LUXE Backoffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #111; color: white; font-family: sans-serif; } </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen" class="bg-gray-900 p-10 rounded-lg shadow-2xl w-full max-w-md border border-gray-800">
        <h2 class="text-3xl text-center mb-6 text-[#C5A880]">Espace Admin</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-black border border-gray-700 rounded p-3 text-white">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Mot de passe</label>
                <input type="password" id="password" required class="w-full bg-black border border-gray-700 rounded p-3 text-white">
            </div>
            <button type="submit" class="w-full bg-[#C5A880] text-black font-bold py-3 rounded hover:bg-white transition">Se connecter</button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden">Identifiants incorrects.</p>
        </form>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="hidden w-full max-w-4xl p-6">
        <div class="flex justify-between items-center mb-10 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-[#C5A880]">Gestion de la Boutique</h1>
            <button id="logout-btn" class="text-sm text-gray-400 hover:text-red-500">Déconnexion</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Formulaire d'ajout (MODIFIÉ POUR L'UPLOAD) -->
            <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                <h2 class="text-xl mb-4 text-[#C5A880]">Ajouter un vêtement</h2>
                <form id="add-product-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Nom du vêtement</label>
                        <input type="text" id="prod-name" required class="w-full bg-black border border-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Prix (en $)</label>
                        <input type="number" id="prod-price" required class="w-full bg-black border border-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Catégorie</label>
                        <select id="prod-category" class="w-full bg-black border border-gray-700 rounded p-2 text-white">
                            <option>Homme</option>
                            <option>Femme</option>
                            <option>Accessoires</option>
                        </select>
                    </div>
                    
                    <!-- CHAMP MODIFIÉ POUR L'UPLOAD D'IMAGE -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Photo du vêtement</label>
                        <input type="file" id="prod-image" accept="image/*" required class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-[#C5A880] file:text-black hover:file:bg-white cursor-pointer">
                        <p class="text-xs text-gray-500 mt-1">Sélectionnez une image depuis votre téléphone ou PC.</p>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="w-full bg-[#C5A880] text-black font-bold py-2 rounded hover:bg-white transition mt-4">Ajouter à la boutique</button>
                    <p id="add-status" class="text-green-500 text-sm text-center hidden mt-2">Vêtement ajouté avec succès !</p>
                    <p id="upload-status" class="text-yellow-500 text-sm text-center hidden mt-2">Envoi de l'image en cours...</p>
                </form>
            </div>

            <!-- Liste des produits existants -->
            <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                <h2 class="text-xl mb-4 text-[#C5A880]">Vêtements en ligne</h2>
                <div id="admin-products-list" class="space-y-3 overflow-y-auto max-h-96 pr-2">
                    <!-- Généré par JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE AVEC STORAGE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // IMPORTATION DE STORAGE
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ⚠️ TA CONFIGURATION FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDttf65TwEHVul4dpRxZkDycK72fAR1iAY",
            authDomain: "menu-f24cc.firebaseapp.com",
            projectId: "menu-f24cc",
            storageBucket: "menu-f24cc.firebasestorage.app",
            messagingSenderId: "460095019040",
            appId: "1:460095019040:web:45f931d14a59027e3b0445",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); // Initialisation de Storage

        // Éléments DOM
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        // Connexion
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => loginError.classList.add('hidden'))
                .catch(() => loginError.classList.remove('hidden'));
        });

        // Déconnexion
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Surveiller l'état de connexion
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                loadAdminProducts();
            } else {
                loginScreen.classList.add('hidden'); // Corrigé pour éviter le clignotement
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
            }
        });

        // 4. Ajouter un produit avec UPLOAD D'IMAGE
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = document.getElementById('prod-name').value;
            const prix = document.getElementById('prod-price').value;
            const categorie = document.getElementById('prod-category').value;
            const file = document.getElementById('prod-image').files[0]; // Le fichier image
            
            const status = document.getElementById('add-status');
            const uploadStatus = document.getElementById('upload-status');
            const submitBtn = document.getElementById('submit-btn');

            if (!file) return alert("Veuillez sélectionner une image.");

            try {
                // A. On affiche "Envoi en cours..."
                uploadStatus.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.innerText = "Patientez...";

                // B. On upload l'image sur Firebase Storage
                const storageRef = ref(storage, 'vetements/' + Date.now() + '_' + file.name);
                await uploadBytes(storageRef, file);
                
                // C. On récupère le lien de l'image
                const imageUrl = await getDownloadURL(storageRef);

                // D. On sauvegarde dans Firestore
                await addDoc(collection(db, "vetements"), { nom, prix, categorie, image: imageUrl });
                
                // E. On nettoie
                status.classList.remove('hidden');
                uploadStatus.classList.add('hidden');
                document.getElementById('add-product-form').reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "Ajouter à la boutique";
                
                setTimeout(() => status.classList.add('hidden'), 3000);
                loadAdminProducts();
                
            } catch (error) {
                console.error(error);
                alert("Erreur lors de l'ajout. Vérifiez vos règles Storage et Firestore.");
                uploadStatus.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = "Ajouter à la boutique";
            }
        });

        // Afficher les produits dans l'admin
        async function loadAdminProducts() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = 'Chargement...';
            const querySnapshot = await getDocs(collection(db, "vetements"));
            list.innerHTML = '';
            
            if(querySnapshot.empty) {
                list.innerHTML = '<p class="text-gray-500 text-sm">Aucun produit.</p>';
                return;
            }

            querySnapshot.forEach((document) => {
                const prod = document.data();
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-black p-3 rounded border border-gray-800">
                        <div class="flex items-center gap-3">
                            <img src="${prod.image}" class="w-10 h-10 object-cover rounded">
                            <div>
                                <p class="text-sm font-bold">${prod.nom}</p>
                                <p class="text-xs text-gray-400">${prod.prix} $</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${document.id}')" class="text-red-500 text-sm hover:underline">Supprimer</button>
                    </div>
                `;
            });
        }

        // Supprimer un produit
        window.deleteProduct = async function(id) {
            if(confirm("Supprimer ce vêtement de la boutique ?")) {
                await deleteDoc(doc(db, "vetements", id));
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
